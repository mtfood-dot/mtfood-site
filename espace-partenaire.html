<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="/manifest-partenaire.json">
<meta name="theme-color" content="#0a2647">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MT Partenaire">
<link rel="apple-touch-icon" href="/icons/partenaire-apple-touch.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>MT Delivery — Espace partenaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0a2647;
    --blue-800:#0f3562;
    --blue-700:#134a8f;
    --blue-600:#1a5cb0;
    --blue-100:#e9f1fb;
    --gold-600:#b8860f;
    --gold-500:#d4a017;
    --gold-400:#e8bb3d;
    --gold-100:#fdf3d9;
    --bg:#f3f5f9;
    --card:#ffffff;
    --text:#131b28;
    --muted:#69748a;
    --danger:#c0392b;
    --green:#1a7d3a;
    --border:#e6eaf1;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --shadow-md:0 6px 20px -6px rgba(16,36,72,.16);
    --shadow-lg:0 20px 40px -12px rgba(10,38,71,.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:40px;-webkit-font-smoothing:antialiased;}
  html[dir="rtl"] body{font-family:'Tajawal','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  a{color:inherit;}
  ::selection{background:var(--gold-100);color:var(--blue-900);}

  header.top{
    background:#ffffff;
    padding:20px 0 22px;position:relative;overflow:hidden;
    border-bottom:1px solid var(--border);text-align:center;
  }
  header.top .brand{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;width:100%;}
  header.top .brand .logo-img{height:auto;width:100%;max-width:280px;display:block;margin:0 auto;}
  header.top .tagline{font-size:13px;color:var(--blue-700);font-weight:700;letter-spacing:.2px;}
  .lang-toggle{
    position:absolute;top:14px;right:14px;z-index:2;
    background:#fff;border:1.5px solid var(--gold-500);color:var(--blue-900);
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;
    font-family:inherit;
  }
  html[dir="rtl"] .lang-toggle{right:auto;left:14px;}

  main{max-width:640px;margin:0 auto;padding:20px 16px 40px;}

  .card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:22px;margin-bottom:16px;}

  /* Écran de connexion */
  .login-card h2{margin:0 0 6px;font-size:19px;color:var(--blue-900);font-weight:800;}
  .login-card p{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.6;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--blue-900);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;font-family:inherit;background:#fbfcfe;transition:border-color .15s ease;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .photo-pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .photo-pick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .photo-btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue-100);color:var(--blue-900);
    border:1.5px dashed var(--blue-600);border-radius:var(--radius-sm);padding:11px 16px;font-weight:800;font-size:13.5px;
    cursor:pointer;font-family:inherit;}
  .photo-btn:focus-visible{outline:3px solid var(--gold-500);outline-offset:2px;}
  .photo-preview{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .photo-preview img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1.5px solid var(--blue-100);background:#fff;}
  .photo-remove{background:none;border:none;color:var(--danger);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline;}
  .photo-hint{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.6;}
  .photo-error{margin:6px 0 0;font-size:12.5px;color:var(--danger);font-weight:700;}
  .photo-error:empty{display:none;}
  .item-thumb{width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue-600);}
  .btn-primary{
    width:100%;background:linear-gradient(135deg,var(--blue-700),var(--blue-900));color:#fff;border:none;
    border-radius:13px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;
  }
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .hrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .hrow .dn{width:84px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px;}
  .hrow .dn input{width:auto;margin:0;}
  .hrow .slots{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px;}
  .hrow .slot{display:flex;align-items:center;gap:6px;direction:ltr;}
  .hrow .slot select{width:auto;flex:1;padding:8px 6px;font-size:14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fbfcfe;font-family:inherit;}
  .hrow .closed-lbl{color:var(--muted);font-size:13px;font-weight:700;}
  .mini-btn{background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--blue-700);cursor:pointer;font-family:inherit;}
  .opt-g{border:1.5px solid var(--border);border-radius:14px;padding:12px;margin:12px 0;background:#fff;}
  .opt-g input[type=text],.opt-g input[type=number]{width:100%;box-sizing:border-box;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;}
  .opt-g .og-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .opt-g .og-row label{font-size:12px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px;}
  .opt-g .oo{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .opt-g .oo input.on{flex:1;min-width:0;} .opt-g .oo input.op{width:96px;flex-shrink:0;}
  .opt-g .del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:6px;min-width:36px;min-height:36px;}
  .opt-apply{margin:12px 0;font-size:13px;} .opt-apply summary{cursor:pointer;font-weight:800;color:var(--blue-700);padding:6px 0;}
  .opt-apply label{display:flex;gap:8px;align-items:center;padding:7px 0;font-size:14px;}
  .set-title{font-size:15px;font-weight:900;color:var(--blue-900);margin:0 0 4px;}
  .error-box{background:#fdeceb;border:1px solid #f3c6c1;color:var(--danger);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:13px;margin-top:12px;line-height:1.5;display:none;}
  .error-box.show{display:block;}
  .success-box{background:#eaf7ee;border:1px solid #bfe6c9;color:var(--green);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:13px;margin-top:12px;line-height:1.5;display:none;}
  .success-box.show{display:block;}

  /* En-tête connecté */
  .session-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(135deg,var(--blue-900),var(--blue-700));color:#fff;border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-md);}
  .session-bar .who{font-size:14px;font-weight:800;}
  .tabs{scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{flex:0 0 auto;scroll-snap-align:center;}
  .mode-switch{display:flex;gap:8px;margin-bottom:12px;}
  .mode-switch button{flex:1;border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:9px 6px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;}
  .mode-switch button.active{background:var(--blue-900);border-color:var(--blue-900);color:#fff;}
  .cat-chips{display:flex;flex-wrap:wrap;gap:7px;}
  .cat-chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;color:var(--text);}
  .cat-chip.on{background:var(--gold-500);border-color:var(--gold-500);color:var(--blue-900);}
  .field-hint{font-size:12px;color:var(--muted);margin:5px 0 0;}
  .multi-row{display:grid;grid-template-columns:1fr 96px 34px;gap:6px;margin-bottom:8px;align-items:center;}
  .multi-row .m-nom{grid-column:1 / 3;}
  .multi-row .m-cat{grid-column:1 / 3;}
  .multi-row input,.multi-row select{width:100%;min-width:0;}
  .multi-row .m-del{grid-row:1 / 3;grid-column:3;border:0;background:#eef0f4;border-radius:50%;width:30px;height:30px;cursor:pointer;color:#555;}
  .multi-row.bad input,.multi-row.bad select{border-color:var(--danger);}
  .multi-row .m-err{grid-column:1 / 3;font-size:11.5px;color:var(--danger);}
  .multi-sep{border:0;border-top:1px dashed var(--border);margin:6px 0 10px;}
  .btn-refresh.active{background:var(--blue-900);color:#fff;border-color:var(--blue-900);}
  .shop-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;}
  .shop-row .switch input:checked + .slider{background:#2fbf71;}
  .shop-closed-banner{background:#fdeceb;color:var(--danger);border-radius:var(--radius-md);padding:10px 12px;margin:0 0 10px;font-weight:700;font-size:13px;}
  .sales-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .sales-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:14px 10px;text-align:center;}
  .sales-card .v{font-size:20px;font-weight:800;color:var(--blue-900);}
  .sales-card .l{font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.3px;}
  .sales-card.wide{grid-column:1 / -1;background:var(--blue-900);}
  .sales-card.wide .v{color:#fff;} .sales-card.wide .l{color:var(--gold-400);}
  .session-bar .zone{font-size:12px;color:var(--gold-400);font-weight:600;}
  .btn-logout{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}

  /* Onglets */
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:999px;
    padding:10px 6px;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:5px;}
  .tab-btn.active{background:var(--blue-900);color:#fff;border-color:var(--blue-900);}
  .tab-btn .count{background:var(--gold-500);color:var(--blue-900);border-radius:999px;
    min-width:18px;height:18px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .tab-btn.active .count{background:var(--gold-400);}


  /* Onglet Publicité (classes boost-* : éviter les noms bloqués par les bloqueurs de pub) */
  .tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;overflow:visible;}
  .tab-btn{white-space:nowrap;border-radius:14px;padding:11px 6px;}
  .boost-info{background:var(--gold-100);color:var(--blue-900);border-radius:var(--radius-md);padding:12px 14px;
    font-size:12.5px;line-height:1.6;margin-bottom:14px;}
  .boost-title{font-size:13.5px;font-weight:800;color:var(--blue-900);margin:4px 0 8px;}
  .boost-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-bottom:6px;}
  .boost-offer{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:12px 8px;
    text-align:center;cursor:pointer;font-family:inherit;color:var(--blue-900);}
  .boost-offer .d{display:block;font-size:13px;font-weight:800;}
  .boost-offer .p{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:700;}
  .boost-offer.sel{border-color:var(--blue-900);background:var(--blue-900);color:#fff;}
  .boost-offer.sel .p{color:var(--gold-400);}
  .boost-hint{font-size:11.5px;color:var(--muted);margin:2px 0 12px;line-height:1.5;}
  .boost-preview{width:100%;max-width:220px;aspect-ratio:1/1;object-fit:cover;border-radius:var(--radius-md);
    border:1px solid var(--border);display:none;margin:0 0 14px;background:#f1f3f7;}
  .boost-preview.on{display:block;}
  .boost-note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .boost-comment{background:#fff7e6;border-left:3px solid var(--gold-500);padding:8px 10px;font-size:12.5px;
    margin-top:8px;border-radius:6px;line-height:1.5;}
  .boost-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
  .btn-small{background:var(--blue-900);color:#fff;border:0;border-radius:999px;padding:8px 16px;
    font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}
  .badge.on{background:#eaf7ee;color:var(--green);}
  .badge.grey{background:#eef0f4;color:var(--muted);}

  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .btn-refresh{background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 14px;
    font-size:12.5px;font-weight:700;color:var(--blue-700);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .date-input{border:1.5px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12.5px;
    font-family:inherit;color:var(--blue-900);background:#fff;}

  .item-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;}
  .item-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .item-card .nom{font-size:15px;font-weight:800;margin-bottom:2px;}
  .item-card .prix{font-size:14px;font-weight:800;color:var(--blue-900);white-space:nowrap;}
  .item-card .desc{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 10px;margin-top:8px;}
  .badge.publie{background:#eaf7ee;color:var(--green);}
  .badge.attente{background:var(--gold-100);color:var(--gold-600);}
  .badge.refuse{background:#fdeceb;color:var(--danger);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px;}
  .toggle-label{font-size:12.5px;font-weight:700;color:var(--muted);}
  .switch{position:relative;display:inline-block;width:44px;height:25px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#d8dee8;transition:.15s;border-radius:999px;}
  .slider:before{position:absolute;content:"";height:19px;width:19px;left:3px;bottom:3px;
    background:#fff;transition:.15s;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider:before{transform:translateX(19px);}
  html[dir="rtl"] .slider:before{left:auto;right:3px;}
  html[dir="rtl"] .switch input:checked + .slider:before{transform:translateX(-19px);}

  .order-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;}
  .order-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .order-card .numero{font-size:11.5px;font-weight:800;color:var(--gold-600);letter-spacing:.3px;}
  .order-card .total{font-size:16px;font-weight:800;color:var(--blue-900);}
  .order-card .meta{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:4px;}
  .order-card .articles{font-size:13px;color:var(--text);background:var(--bg);border-radius:var(--radius-sm);
    padding:8px 10px;margin:8px 0;line-height:1.5;}

  .tab-btn .count.alert{background:var(--danger,#c62828);color:#fff;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  .live-card{border-width:2px;}
  .live-card.new{border-color:var(--gold-500);box-shadow:0 0 0 3px rgba(212,160,23,.18);}
  .live-card .st{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;}
  .live-card .st.new{background:var(--gold-100);color:var(--gold-600);}
  .live-card .st.ok{background:#eaf7ee;color:var(--green);}
  .live-card .st.road{background:#e8f0fb;color:var(--blue-900);}
  .live-card .ago{font-size:12px;color:var(--muted);font-weight:700;}
  .live-card .notes{font-size:12.5px;color:#8a5a00;background:#fff5e0;border-radius:var(--radius-sm);padding:6px 10px;margin-top:6px;}
  .live-actions{display:flex;gap:10px;margin-top:12px;}
  .live-actions button{flex:1;border:none;border-radius:var(--radius-sm);padding:12px;font-weight:800;font-size:14.5px;font-family:inherit;cursor:pointer;}
  .live-actions .acc{background:var(--green,#1a7d3a);color:#fff;}
  .live-actions .rdy{background:var(--blue-900,#0f2f66);color:#fff;}
  .live-card .st.ready{background:#eaf7ee;color:var(--green);}
  .live-actions .ref{background:#fdeceb;color:var(--danger,#c62828);}
  .live-actions .ref.confirm{background:var(--danger,#c62828);color:#fff;}
  .live-actions button:disabled{opacity:.55;}
  .alert-setup{background:var(--gold-100);border:1.5px solid var(--gold-500);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5;color:var(--blue-900);}
  .alert-setup button{margin-top:8px;width:100%;background:var(--blue-900);color:#fff;border:none;border-radius:var(--radius-sm);padding:11px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;}
  .live-info{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 10px;}
  .empty-state{text-align:center;color:var(--muted);font-size:13.5px;padding:40px 20px;}
  .empty-state .emoji{font-size:32px;display:block;margin-bottom:10px;}

  .hidden{display:none !important;}

  .footer-note{max-width:960px;margin:24px auto 0;padding:0 16px;text-align:center;
    color:var(--muted);font-size:11.5px;font-weight:500;}
</style>
<script src="/form-validate.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function (err) {
      console.warn("Service worker non enregistré :", err);
    });
  });
}
</script>
</head>
<body>

<header class="top">
  <div class="brand">
    <div style="display:block;"><img class="logo-img" src="logo.png" alt="MT Delivery" width="316" height="158" loading="eager"></div>
    <div class="tagline" id="tagline">Espace partenaire</div>
  </div>
  <button class="lang-toggle" id="langToggle" type="button">AR</button>
</header>

<main>

  <!-- ================= ÉCRAN DE CONNEXION ================= -->
  <section id="loginScreen" class="card login-card" data-mtform data-note-before="#loginBtn">
    <h2 id="loginTitle">Connexion partenaire</h2>
    <p id="loginSubtitle">Entre le numéro de téléphone utilisé pour ta demande de partenariat.</p>
    <div class="field">
      <label id="lblPhone" for="fPhone">Numéro de téléphone</label>
      <input type="tel" id="fPhone" data-required data-rule="phone" placeholder="Ex: 0555 xx xx xx" inputmode="numeric">
    </div>
    <div class="field">

/* ============================================================
   APPEL API
   ============================================================ */
function checkAuth_(data) {
  // Session refusée par le serveur (jeton expiré / compte désactivé) : retour à la connexion.
  if (data && data.code === "auth" && SESSION) {
    SESSION = null;
    localStorage.removeItem(SESSION_KEY);
    $("appScreen").classList.add("hidden");
    $("loginScreen").classList.remove("hidden");
    $("fPin").value = "";
    showError($("loginError"), t("sessionExpired"));
  }
  return data;
}

async function apiGet(params) {
  // Jeton de session ajouté automatiquement (sauf connexion).
  params = Object.assign({}, params);
  if (SESSION && SESSION.token && params.action !== "partnerLogin") params.token = SESSION.token;
  // Envoi en POST : mots de passe et codes PIN ne passent plus dans l'URL.
  const res = await fetch(CONFIG.API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(params)
  });
  const txt = await res.text();
  try { return checkAuth_(JSON.parse(txt)); }
  catch (e) { throw new Error("Réponse invalide du serveur"); }
}

   CONNEXION / SESSION
   ============================================================ */
function showError(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideError(box) {
  box.classList.remove("show");
  box.textContent = "";
}
function showSuccess(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideSuccess(box) {
  box.classList.remove("show");
  box.textContent = "";
}

$("loginBtn").addEventListener("click", doLogin);
$("fPhone").addEventListener("keydown", (e) => { if (e.key === "Enter") $("fPin").focus(); });
$("fPin").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  hideError($("loginError"));
  if (!MTForm.validate($("loginScreen"))) return;
  const phone = $("fPhone").value.trim();
  const pin = $("fPin").value.trim();
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "...";
  try {
    const data = await apiGet({ action: "partnerLogin", telephone: phone, pin: pin });
    if (data.success) {
      SESSION = { nom: data.nom, telephone: data.telephone, type: data.type, zone: data.zone, token: data.token || "" };
      localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
      enterApp();
    } else {
      showError($("loginError"), data.error || t("loginFailedGeneric"));
    }
  } catch (e) {
    showError($("loginError"), t("loginFailedGeneric"));
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = t("loginBtn");
  }
}

$("logoutBtn").addEventListener("click", () => {
  stopLivePolling();
  SESSION = null;
  localStorage.removeItem(SESSION_KEY);
  $("appScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("fPhone").value = "";
  $("fPin").value = "";
});

/* ---- Ouvert / Fermé en un clic ---- */
let SHOP = null;   // { open, manual, hours }
function renderShop() {
  if (!SESSION) return;
  const tg = $("shopToggle");
  if (!SHOP) { $("zoneText").textContent = ""; $("shopToggleLbl").textContent = ""; return; }
  tg.checked = !SHOP.manual;
  $("shopToggleLbl").textContent = SHOP.manual ? t("shopClosedLbl") : t("shopOpenLbl");
  $("zoneText").textContent = SHOP.manual ? "🔴 " + t("shopClosedLbl") : (SHOP.open ? "🟢 " + t("shopOpenLbl") : "🟠 " + t("shopHoursNote"));
  let b = $("shopBanner");
  if (SHOP.manual) {
    if (!b) { b = document.createElement("div"); b.id = "shopBanner"; b.className = "shop-closed-banner"; $("errorBox").parentNode.insertBefore(b, $("errorBox")); }
    b.textContent = t("shopBanner");
  } else if (b) b.remove();
}
async function loadShop() {
  try { const d = await apiGet({ action: "partnerShop" }); if (d && d.success) { SHOP = { open: d.open, manual: d.manual, hours: d.hours }; renderShop(); } } catch (e) { /* silencieux */ }
}
$("shopToggle").addEventListener("change", async () => {
  const tg = $("shopToggle"), wantOpen = tg.checked;
  tg.disabled = true; hideError($("errorBox"));
  try {
    const d = await apiGet({ action: "partnerSetClosed", closed: wantOpen ? "NON" : "OUI" });
    if (d && d.success) SHOP = { open: d.open, manual: d.manual, hours: d.hours };
    else showError($("errorBox"), (d && d.error) || t("shopError"));
  } catch (e) { showError($("errorBox"), t("shopError")); }
  tg.disabled = false; renderShop();
});

function unlockAudio_() {
  try {
    if (!AUDIO_CTX) AUDIO_CTX = new (window.AudioContext || window.webkitAudioContext)();
    if (AUDIO_CTX.state === "suspended") AUDIO_CTX.resume();
  } catch (e) {}
}
document.addEventListener("click", unlockAudio_, { once: true });

function ringBell_() {
  try {
    unlockAudio_();
    if (AUDIO_CTX) {
      const now = AUDIO_CTX.currentTime;
      [0, 0.35, 0.7].forEach((d, i) => {
        const o = AUDIO_CTX.createOscillator(), g = AUDIO_CTX.createGain();
        o.type = "sine"; o.frequency.value = i === 1 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001, now + d);
        g.gain.exponentialRampToValueAtTime(0.5, now + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + d + 0.3);
        o.connect(g); g.connect(AUDIO_CTX.destination);
        o.start(now + d); o.stop(now + d + 0.32);
      });
    }
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
}

  const freshSet = new Set(fresh || []);
  $("listLive").innerHTML = LIVE_ORDERS.length
    ? LIVE_ORDERS.map(o => liveCardHtml(o, freshSet.has(String(o.numero)))).join("")
    : emptyStateHtml(t("liveNone"), "🛎️");
  $("listLive").querySelectorAll("[data-rdy]").forEach(b => b.addEventListener("click", () => markReady(b.dataset.rdy, b)));
  $("listLive").querySelectorAll("[data-acc]").forEach(b => b.addEventListener("click", () => decideLive(b.dataset.acc, true, b)));
  $("listLive").querySelectorAll("[data-ref]").forEach(b => b.addEventListener("click", () => {
    // Refus en deux appuis (pas de fenêtre de confirmation du navigateur)
    if (!b.classList.contains("confirm")) {
      b.classList.add("confirm"); b.textContent = t("liveRefuseConfirm");
      setTimeout(() => { if (b.isConnected) { b.classList.remove("confirm"); b.textContent = t("liveRefuse"); } }, 4000);
      return;
    }
    decideLive(b.dataset.ref, false, b);
  }));
}

async function decideLive(numero, accept, btn) {

/* ---- Photo du plat : choix, réduction (max 900 px, JPEG) et aperçu ---- */
let PHOTO_DATA = "";          // data:image/jpeg;base64,... (vide = pas de photo)
const PHOTO_MAX_SIDE = 900;
const PHOTO_MAX_INPUT = 15 * 1024 * 1024;

function refreshPhotoUi() {
  const has = !!PHOTO_DATA;
  $("photoPreviewWrap").classList.toggle("hidden", !has);
  if (has) $("photoPreview").src = PHOTO_DATA;
  $("photoBtnTxt").textContent = t(has ? "photoChange" : "photoChoose");
}
function setPhotoError(msg) { $("photoError").textContent = msg || ""; }
function clearPhoto() {
  PHOTO_DATA = "";
  $("pPhoto").value = "";
  setPhotoError("");
  refreshPhotoUi();
}
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) throw new Error("size");
        const k = Math.min(1, PHOTO_MAX_SIDE / Math.max(w, h));
        w = Math.round(w * k); h = Math.round(h * k);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";           // fond blanc (PNG transparents)
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = 0.82, out = c.toDataURL("image/jpeg", q);
        while (out.length > 400000 && q > 0.45) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
        resolve(out);
      } catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("read")); };
    img.src = url;
  });
}
$("photoBtn").addEventListener("click", () => $("pPhoto").click());
$("photoRemove").addEventListener("click", clearPhoto);
$("pPhoto").addEventListener("change", async () => {
  const f = $("pPhoto").files && $("pPhoto").files[0];
  setPhotoError("");
  if (!f) return;
  if (f.type && !/^image\//i.test(f.type)) { clearPhoto(); setPhotoError(t("photoErrType")); return; }
  if (f.size > PHOTO_MAX_INPUT) { clearPhoto(); setPhotoError(t("photoErrBig")); return; }
  try {
    PHOTO_DATA = await resizeImage(f);
    refreshPhotoUi();
  } catch (e) {
    clearPhoto();
    setPhotoError(t("photoErrRead"));
  }
});

/* ---- Plusieurs plats d'un coup (un envoi par ligne, validés comme les autres) ---- */
const MULTI_MAX = 30;
let MULTI = [];   // [{ nom, categorie, prix, err }]
function newMultiRow(prev) { return { nom: "", categorie: prev ? prev.categorie : "", prix: "", err: "" }; }
function setMode(many) {
  $("modeOne").classList.toggle("active", !many); $("modeMany").classList.toggle("active", many);
  $("proposeForm").classList.toggle("hidden", many); $("proposeMulti").classList.toggle("hidden", !many);
  if (many && !MULTI.length) { MULTI = [newMultiRow(), newMultiRow(), newMultiRow()]; renderMultiRows(true); }
}
$("modeOne").addEventListener("click", () => setMode(false));
$("modeMany").addEventListener("click", () => setMode(true));
function catOptionsHtml(sel) {
  return '<option value="">' + escapeHtml(t("chooseCategory")) + "</option>" + MENU_CATEGORIES.map(c => '<option value="' + escapeAttr(c.fr) + '"' + (c.fr === sel ? " selected" : "") + ">" + escapeHtml(LANG === "ar" ? c.ar : c.fr) + "</option>").join("");
}
function renderMultiRows(force) {
  if (!force && document.activeElement && $("multiRows").contains(document.activeElement)) return;
  $("multiRows").innerHTML = MULTI.map((r, i) =>
    '<div class="multi-row' + (r.err ? " bad" : "") + '" data-i="' + i + '">' +
    '<input class="m-nom" type="text" maxlength="80" data-f="nom" placeholder="' + escapeAttr(t("multiNamePh")) + '" value="' + escapeAttr(r.nom) + '">' +
    '<select class="m-cat" data-f="categorie">' + catOptionsHtml(r.categorie) + "</select>" +
    '<input class="m-prix" type="number" min="1" inputmode="numeric" data-f="prix" placeholder="' + escapeAttr(t("multiPricePh")) + '" value="' + escapeAttr(r.prix) + '">' +
    '<button type="button" class="m-del" data-del="' + i + '" aria-label="×">✕</button>' +
    (r.err ? '<div class="m-err">' + escapeHtml(r.err) + "</div>" : "") + "</div>" + '<hr class="multi-sep">').join("");
  $("multiAdd").hidden = MULTI.length >= MULTI_MAX;
  updateMultiBtn();
}
function filledRows() { return MULTI.filter(r => r.nom.trim() || r.prix !== "" ); }
function updateMultiBtn() { const n = filledRows().length; $("multiSend").textContent = t("multiSend").replace("{n}", n); $("multiSend").disabled = !n; }
$("multiRows").addEventListener("input", (ev) => {
  const el = ev.target.closest("[data-f]"); if (!el) return;
  const row = el.closest("[data-i]"), r = MULTI[Number(row.dataset.i)];
  r[el.dataset.f] = el.value; r.err = ""; row.classList.remove("bad"); const e = row.querySelector(".m-err"); if (e) e.remove();
  updateMultiBtn();
});
$("multiRows").addEventListener("click", (ev) => {
  const d = ev.target.closest("[data-del]"); if (!d) return;
  MULTI.splice(Number(d.dataset.del), 1); if (!MULTI.length) MULTI = [newMultiRow()]; renderMultiRows(true);
});
$("multiAdd").addEventListener("click", () => {
  if (MULTI.length >= MULTI_MAX) { showError($("errorBox"), t("multiMax")); return; }
  MULTI.push(newMultiRow(MULTI[MULTI.length - 1])); renderMultiRows(true);
  const inputs = $("multiRows").querySelectorAll(".m-nom"); if (inputs.length) inputs[inputs.length - 1].focus();
});
$("multiSend").addEventListener("click", async () => {
  hideError($("errorBox")); hideSuccess($("successBox"));
  const rows = MULTI.filter(r => r.nom.trim() || r.prix !== "");
  if (!rows.length) { showError($("errorBox"), t("multiNone")); return; }
  let bad = 0;
  rows.forEach(r => {
    const p = Number(r.prix);
    r.err = r.nom.trim().length < 2 ? t("multiErrNom") : (!r.categorie ? t("multiErrCat") : (!(p >= 1 && isFinite(p)) ? t("multiErrPrix") : ""));
    if (r.err) bad++;
  });
  if (bad) { renderMultiRows(true); return; }
  const btn = $("multiSend"); btn.disabled = true;
  let sent = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i]; btn.textContent = "… " + (i + 1) + "/" + rows.length;
    const cat = MENU_CATEGORIES.find(c => c.fr === r.categorie);
    try {
      const payload = JSON.stringify({ nom: r.nom.trim(), categorie: r.categorie, categorie_ar: cat ? cat.ar : "", prix: Number(r.prix), description: "", photoData: "" });
      const d = await apiGet({ action: "proposeMenuItem", telephone: SESSION.telephone, payload });
      if (d && d.success) { sent++; r.done = true; } else r.err = (d && d.error) || t("proposeFailedGeneric");
    } catch (e) { r.err = t("proposeFailedGeneric"); }
  }
  MULTI = MULTI.filter(r => !r.done); if (!MULTI.length) MULTI = [newMultiRow(), newMultiRow(), newMultiRow()];
  const left = MULTI.filter(r => r.err).length;
  renderMultiRows(true);
  if (sent) { showSuccess($("successBox"), left ? t("multiPartial").replace("{n}", sent).replace("{m}", left) : t("multiDone").replace("{n}", sent)); await loadMenu(); }
  if (left) showError($("errorBox"), t("proposeFailedGeneric"));
});

async function onPropose() {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  const nom = $("pNom").value.trim();
  const categorie = $("pCategorie").value;
  const prix = $("pPrix").value.trim();
  const description = $("pDescription").value.trim();

  if (!MTForm.validate($("proposeForm"))) return;
  if (!categorie) { showError($("errorBox"), t("chooseCategory")); return; }

  $("proposeBtn").disabled = true;
  $("proposeBtn").textContent = "...";
  try {
    const cat = MENU_CATEGORIES.find(c => c.fr === categorie);
    const payload = JSON.stringify({ nom, categorie, categorie_ar: cat ? cat.ar : "", prix: Number(prix), description, photoData: PHOTO_DATA });
    const data = await apiGet({ action: "proposeMenuItem", telephone: SESSION.telephone, payload });
    if (data.success) {
      showSuccess($("successBox"), t("proposeSuccess"));
      $("pNom").value = "";
      $("pPrix").value = "";
      $("pDescription").value = "";
      $("pCategorie").value = ""; renderCatChips();
      clearPhoto();
      await loadMenu();
    } else {
      showError($("errorBox"), data.error || t("proposeFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("proposeFailedGeneric"));
  } finally {
    $("proposeBtn").disabled = false;
    $("proposeBtn").textContent = t("proposeBtn");
  }
}

function applyBoostLabels() {
  $("tabBoostLabel").textContent = t("tabBoostLabel");
  $("boostInfo").textContent = t("boostInfo");
  $("boostOffersTitle").textContent = t("boostOffersTitle");
  $("boostFormatHint").textContent = t("boostFormatHint");
  $("lblBItem").textContent = t("lblBItem");
  $("lblBTexte").textContent = t("lblBTexte");
  $("lblBImage").textContent = t("lblBImage");
  $("lblBDebut").textContent = t("lblBDebut");
  $("boostSendBtn").textContent = BOOST_EDIT_ID ? t("boostResend") : t("boostSend");
  $("boostCancelBtn").textContent = t("boostCancel");
  $("boostMyTitle").textContent = t("boostMyTitle");
}

async function loadBoost() {
  try {
    const [o, r] = await Promise.all([
      apiGet({ action: "getPubOffers" }),
      apiGet({ action: "getMyPubRequests", telephone: SESSION.telephone })
    ]);
    if (o && o.success) BOOST_OFFERS = o.offers || [];
    if (r && r.success) BOOST_REQS = r.requests || [];
    if (!BOOST_SEL && BOOST_OFFERS.length) BOOST_SEL = BOOST_OFFERS[0].id;
  } catch (e) { /* on garde l'état précédent */ }
  renderBoost();
}

function boostStateLabel(r) {
  let label = t("st_" + r.etat);
  if ((r.etat === "active" || r.etat === "planifiee") && !r.paye) label = t("st_approuvee") + " · " + t("boostPayWait");
  return label;
}
function boostBadgeClass(r) {
  if (r.etat === "active" && r.paye) return "on";
  if (r.etat === "refusee") return "refuse";
  if (r.etat === "expiree" || r.etat === "suspendue") return "grey";
  if (r.etat === "planifiee" && r.paye) return "publie";
  return "attente";
}

function boostMenuItems() {
  return MENU_ITEMS.filter(i => {
    const st = String(i.statut || "Publié").trim();
    return st !== "En attente" && st !== "Refusé" && st !== "Refuse";
  });
}
function renderBoostItemSelect(selectedId) {
  const sel = $("bItem");
  const keep = selectedId != null ? String(selectedId) : sel.value;
  const items = boostMenuItems();
  sel.innerHTML = `<option value="">${escapeHtml(t("boostPickItem"))}</option>` +
    items.map(i => `<option value="${escapeAttr(i.id)}">${escapeHtml(i.nom)} — ${escapeHtml(String(i.prix || 0))} DA</option>`).join("");
  if (keep && items.some(i => String(i.id) === keep)) sel.value = keep;
  $("bItemNote").textContent = items.length ? t("boostItemNote") : t("boostNoItems");
}

function renderBoost() {
  renderBoostItemSelect();
  const offersBox = $("boostOffers");
  offersBox.innerHTML = BOOST_OFFERS.map(o =>
    `<button type="button" class="boost-offer${o.id === BOOST_SEL ? " sel" : ""}" data-offer="${escapeAttr(o.id)}">` +
    `<span class="d">${o.dureeJours} ${escapeHtml(t("boostDays"))}</span>` +
    `<span class="p">${Number(o.prixDA).toLocaleString("fr-FR")} DA</span></button>`).join("");

  const need = BOOST_REQS.filter(r => r.etat === "a_modifier").length;
  const c = $("countBoost");
  c.textContent = need;
  c.style.display = need ? "" : "none";

  const list = $("listBoost");
  if (!BOOST_REQS.length) { list.innerHTML = emptyStateHtml(t("boostNone"), "📣"); return; }
  list.innerHTML = BOOST_REQS.map(r => {
    const period = r.debut && r.fin ? `<div class="desc">${escapeHtml(t("boostPeriod"))} : ${escapeHtml(r.debut)} → ${escapeHtml(r.fin)}</div>` : "";
    const comment = r.commentaire ? `<div class="boost-comment"><b>${escapeHtml(t("boostAdminComment"))}</b> ${escapeHtml(r.commentaire)}</div>` : "";
    let actions = "";
    if (r.etat === "a_modifier") actions = `<button class="btn-small" type="button" data-edit="${escapeAttr(r.id)}">${escapeHtml(t("boostEdit"))}</button>`;
    else if (r.etat === "expiree" || r.etat === "refusee") actions = `<button class="btn-small" type="button" data-renew="${escapeAttr(r.id)}">${escapeHtml(t("boostRenew"))}</button>`;
    return `<div class="item-card"><div class="row1"><div><div class="nom">${escapeHtml(r.nomPlat)}</div>` +
      `<div class="desc">${escapeHtml(r.id)} · ${r.dureeJours} ${escapeHtml(t("boostDays"))} · ${Number(r.prixDA).toLocaleString("fr-FR")} DA</div></div></div>` +
      period + `<span class="badge ${boostBadgeClass(r)}">${escapeHtml(boostStateLabel(r))}</span>` + comment +
      (actions ? `<div class="boost-actions">${actions}</div>` : "") + `</div>`;
  }).join("");
}

function fillBoostForm(r, editing) {
  $("bTexte").value = r.texte || "";
  $("bImage").value = r.imageUrl || "";
  $("bDebut").value = todayStr();
  if (r.offreId && BOOST_OFFERS.some(o => o.id === r.offreId)) BOOST_SEL = r.offreId;
  BOOST_EDIT_ID = editing ? r.id : "";
  $("boostCancelBtn").style.display = editing ? "" : "none";
  applyBoostLabels();
  updateBoostPreview();
  renderBoost();
  renderBoostItemSelect(r.itemId || "");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetBoostForm() {
  fillBoostForm({}, false);
}

function updateBoostPreview() {
  const url = $("bImage").value.trim();
  const img = $("boostPreview");
  if (/^https:\/\/\S+$/i.test(url)) {
    img.onerror = () => img.classList.remove("on");
    img.onload = () => img.classList.add("on");
    img.src = url;
  } else {
    img.classList.remove("on");
    img.removeAttribute("src");
  }
}
$("bImage").addEventListener("input", updateBoostPreview);

$("boostOffers").addEventListener("click", ev => {
  const b = ev.target.closest("[data-offer]");
  if (!b) return;
  BOOST_SEL = b.getAttribute("data-offer");
  MTForm.clearError($("boostOffers"));
  renderBoost();
});
$("listBoost").addEventListener("click", ev => {
  const e = ev.target.closest("[data-edit]");
  const n = ev.target.closest("[data-renew]");
  if (e) { const r = BOOST_REQS.find(x => x.id === e.getAttribute("data-edit")); if (r) fillBoostForm(r, true); }
  if (n) { const r = BOOST_REQS.find(x => x.id === n.getAttribute("data-renew")); if (r) fillBoostForm(r, false); }
});
$("boostCancelBtn").addEventListener("click", resetBoostForm);
$("boostSendBtn").addEventListener("click", onBoostSend);

async function onBoostSend() {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  const chosen = MENU_ITEMS.find(i => String(i.id) === $("bItem").value);
  const imageUrl = $("bImage").value.trim();
  const debutSouhaite = $("bDebut").value;
  $("bDebut").min = todayStr();
  const offerBad = !BOOST_SEL && !BOOST_EDIT_ID;
  const formOk = MTForm.validate($("panelBoost"));
  if (offerBad) { MTForm.fail($("boostOffers"), t("boostPickOffer")); return; }
  if (!formOk || !chosen) return;

  const params = {
    action: BOOST_EDIT_ID ? "resubmitPubRequest" : "submitPubRequest",
    telephone: SESSION.telephone,
    nomPlat: chosen.nom,
    prixPlat: String(chosen.prix || ""),
    itemId: String(chosen.id),
    texte: $("bTexte").value.trim(),
    imageUrl: imageUrl,
    lienUrl: "",
    debutSouhaite: debutSouhaite
  };
  if (BOOST_EDIT_ID) params.id = BOOST_EDIT_ID; else params.offreId = BOOST_SEL;

  const wasEdit = !!BOOST_EDIT_ID;
  $("boostSendBtn").disabled = true;
  $("boostSendBtn").textContent = "...";
  try {
    const data = await apiGet(params);
    if (data.success) {
      showSuccess($("successBox"), wasEdit ? t("boostResent") : t("boostSent"));
      resetBoostForm();
      await loadBoost();
    } else {
      showError($("errorBox"), data.error || t("boostFailed"));
    }
  } catch (e) {
    showError($("errorBox"), t("boostFailed"));
  } finally {
    $("boostSendBtn").disabled = false;
    applyBoostLabels();
  }
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function emptyStateHtml(msg, emoji) {
  return `<div class="empty-state"><span class="emoji">${emoji || "🍽️"}</span>${escapeHtml(msg)}</div>`;
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

if (SESSION && SESSION.telephone) {
  enterApp();
}
