<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a2647">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MT Food">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="robots" content="noindex, nofollow">
<title>MT Delivery — Espace admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0a2647;
    --blue-800:#0f3562;
    --blue-700:#134a8f;
    --blue-600:#1a5cb0;
    --blue-100:#e9f1fb;
    --gold-600:#b8860f;
    --gold-500:#d4a017;
    --gold-400:#e8bb3d;
    --gold-100:#fdf3d9;
    --bg:#f3f5f9;
    --card:#ffffff;
    --text:#131b28;
    --muted:#69748a;
    --danger:#c0392b;
    --green:#1a7d3a;
    --border:#e6eaf1;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --shadow-md:0 6px 20px -6px rgba(16,36,72,.16);
    --shadow-lg:0 20px 40px -12px rgba(10,38,71,.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:40px;-webkit-font-smoothing:antialiased;}
  html[dir="rtl"] body{font-family:'Tajawal','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  a{color:inherit;}
  ::selection{background:var(--gold-100);color:var(--blue-900);}

  header.top{
    background:#ffffff;
    padding:20px 0 22px;position:relative;overflow:hidden;
    border-bottom:1px solid var(--border);text-align:center;
  }
  header.top .brand{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;width:100%;}
  header.top .brand .logo-img{height:auto;width:100%;max-width:280px;display:block;margin:0 auto;}
  header.top .tagline{font-size:13px;color:var(--blue-700);font-weight:700;letter-spacing:.2px;}
  .lang-toggle{
    position:absolute;top:14px;right:14px;z-index:2;
    background:#fff;border:1.5px solid var(--gold-500);color:var(--blue-900);
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;
    font-family:inherit;
  }
  html[dir="rtl"] .lang-toggle{right:auto;left:14px;}

  main{max-width:640px;margin:0 auto;padding:20px 16px 40px;}

  .card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:22px;margin-bottom:16px;}

  /* Écran de connexion */
  .login-card h2{margin:0 0 6px;font-size:19px;color:var(--blue-900);font-weight:800;}
  .login-card p{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.6;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--blue-900);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;font-family:inherit;background:#fbfcfe;transition:border-color .15s ease;
  }
  .field input:focus{outline:none;border-color:var(--blue-600);}
  .btn-primary{
    width:100%;background:linear-gradient(135deg,var(--blue-700),var(--blue-900));color:#fff;border:none;
    border-radius:13px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;
  }
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .error-box{background:#fdeceb;border:1px solid #f3c6c1;color:var(--danger);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:13px;margin-top:12px;line-height:1.5;display:none;}
  .error-box.show{display:block;}
  .success-box{background:#eaf7ee;border:1px solid #bfe6c9;color:var(--green);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:13px;margin-top:12px;line-height:1.5;display:none;}
  .success-box.show{display:block;}

  /* En-tête connecté */
  .session-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(135deg,var(--blue-900),var(--blue-700));color:#fff;border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-md);}
  .session-bar .who{font-size:14px;font-weight:800;}
  .session-bar .zone{font-size:12px;color:var(--gold-400);font-weight:600;}
  .btn-logout{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}

  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .btn-refresh{background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 14px;
    font-size:12.5px;font-weight:700;color:var(--blue-700);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .date-input{border:1.5px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12.5px;
    font-family:inherit;color:var(--blue-900);background:#fff;}

  .order-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;}
  .order-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .order-card .numero{font-size:11.5px;font-weight:800;color:var(--gold-600);letter-spacing:.3px;}
  .order-card .total{font-size:16px;font-weight:800;color:var(--blue-900);}
  .order-card .meta{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:4px;}
  .order-card .client{font-size:14.5px;font-weight:700;color:var(--text);}
  .order-card .articles{font-size:13px;color:var(--text);background:var(--bg);border-radius:var(--radius-sm);
    padding:8px 10px;margin:8px 0;line-height:1.5;}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 10px;margin:6px 0;}
  .badge.aconfirmer{background:var(--gold-100);color:var(--gold-600);}
  .badge.enattente{background:#e9f1fb;color:var(--blue-700);}
  .badge.enlivraison{background:#e9f1fb;color:var(--blue-700);}
  .badge.livree{background:#eaf7ee;color:var(--green);}
  .badge.annulee{background:#fdeceb;color:var(--danger);}

  .actions-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .btn-action{flex:1;min-width:110px;border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:800;
    cursor:pointer;font-family:inherit;border:1.5px solid transparent;text-align:center;text-decoration:none;display:inline-block;}
  .btn-confirm{background:var(--blue-700);color:#fff;}
  .btn-cancel{background:#fff;border-color:#f3c6c1;color:var(--danger);}
  .btn-deliver{background:var(--green);color:#fff;}
  .btn-whatsapp{background:#25D366;color:#fff;}
  .btn-action:disabled{opacity:.5;cursor:default;}

  .empty-state{text-align:center;color:var(--muted);font-size:13.5px;padding:40px 20px;}
  .empty-state .emoji{font-size:32px;display:block;margin-bottom:10px;}

  .tab-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tab-btn{flex:1 1 auto;min-width:92px;background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:9px 10px;
    font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit;position:relative;}
  .tab-btn.active{background:var(--blue-700);border-color:var(--blue-700);color:#fff;}
  .mod-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;
    font-weight:800;border-radius:999px;padding:2px 6px;min-width:16px;line-height:1.4;}
  html[dir="rtl"] .mod-badge{right:auto;left:-6px;}

  .dish-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;display:flex;gap:12px;}
  .dish-card img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg);flex-shrink:0;}
  .dish-card .info{flex:1;min-width:0;}
  .dish-card .nom{font-size:14.5px;font-weight:800;color:var(--text);}
  .dish-card .meta{font-size:12.5px;color:var(--muted);margin:2px 0 6px;}
  .dish-card .prix{font-size:14px;font-weight:800;color:var(--blue-900);margin-bottom:8px;}
  .btn-publish{background:var(--green);color:#fff;}
  .btn-reject{background:#fff;border-color:#f3c6c1;color:var(--danger);}

  .subheading{font-size:12.5px;font-weight:800;color:var(--blue-900);margin:16px 0 10px;
    text-transform:uppercase;letter-spacing:.4px;}
  .subheading:first-child{margin-top:2px;}
  .partner-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;}
  .partner-card .nom{font-size:14.5px;font-weight:800;color:var(--text);}
  .partner-card .meta{font-size:12.5px;color:var(--muted);margin:2px 0 8px;}
  .status-badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 10px;margin-bottom:10px;}
  .status-badge.actif{background:#eaf7ee;color:var(--green);}
  .status-badge.disponible{background:#eaf7ee;color:var(--green);}
  .status-badge.enlivraison{background:#e9f1fb;color:var(--blue-700);}
  .status-badge.enattente{background:var(--gold-100);color:var(--gold-600);}
  .status-badge.refuse{background:#fdeceb;color:var(--danger);}
  .btn-activate{background:var(--green);color:#fff;}
  .tab-count{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;margin-inline-start:6px;
    border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;text-align:center;vertical-align:middle;}
  .boost-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);border:1px solid var(--border);padding:14px;margin-bottom:12px;}
  .boost-head{display:flex;gap:12px;}
  .boost-thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--bg);flex-shrink:0;border:1px solid var(--border);}
  .boost-main{flex:1;min-width:0;}
  .boost-main .nom{font-size:15px;font-weight:800;color:var(--text);}
  .boost-meta{font-size:12px;color:var(--muted);line-height:1.6;margin-top:2px;}
  .boost-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .boost-sum span{background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;color:var(--blue-900);}
  .boost-form{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px;}
  .boost-form label{display:block;font-size:12px;font-weight:700;color:var(--blue-900);margin:8px 0 4px;}
  .boost-form input[type=date],.boost-form textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;background:#fff;color:var(--text);}
  .boost-form textarea{min-height:52px;resize:vertical;}
  .boost-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-top:10px;}
  .boost-hist{margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.6;background:var(--bg);border-radius:8px;padding:8px 10px;}
  .boost-filter{border:1.5px solid var(--border);border-radius:999px;padding:7px 12px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--blue-900);}
  .requests-block{background:#fff8e6;border:1.5px solid #f4d58d;border-radius:var(--radius-md);padding:12px 12px 2px;margin-bottom:16px;}
  .requests-block .subheading{margin-top:0;}
  .btn-refuse{background:#fff;border-color:#f3c6c1;color:var(--danger);}
  .btn-deactivate{background:#fff;border-color:#f3c6c1;color:var(--danger);}
  .pin-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .pin-row input{width:90px;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fbfcfe;letter-spacing:2px;text-align:center;}
  .pin-row input:focus{outline:none;border-color:var(--blue-600);}
  .btn-savepin{background:var(--blue-700);color:#fff;flex:none;padding:8px 14px;}

  .eval-overlay{position:fixed;inset:0;background:rgba(10,25,50,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;}
  .eval-sheet{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:16px 16px 18px;box-shadow:var(--shadow-md);}
  .eval-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .eval-title{font-size:16px;font-weight:800;color:var(--text);line-height:1.35;}
  .eval-x{background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--muted);flex:none;font-family:inherit;}
  .eval-info{border:1px solid var(--border);border-radius:12px;background:#fbfcfe;margin:6px 0 12px;}
  .eval-row{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5;}
  .eval-row:last-child{border-bottom:none;}
  .eval-row .k{flex:0 0 38%;color:var(--muted);font-weight:700;}
  .eval-row .v{flex:1;min-width:0;color:var(--text);font-weight:600;word-break:break-word;white-space:pre-wrap;}
  .eval-label{display:block;font-size:12px;font-weight:800;color:var(--blue-900);margin:10px 0 4px;}
  .eval-field{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--text);}
  textarea.eval-field{min-height:78px;resize:vertical;}
  .eval-err{background:#fdeceb;color:var(--danger);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:10px;}
  .eval-ok{background:#eaf7ee;color:var(--green);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:800;margin:4px 0 10px;}
  .eval-note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:6px 0;}
  .eval-note b{color:var(--text);letter-spacing:1.5px;}
  .eval-loading{text-align:center;color:var(--muted);font-size:13.5px;padding:28px 10px;}

  .stats-row{display:flex;gap:10px;flex-wrap:wrap;}
  .stat-card{flex:1;min-width:140px;background:var(--card);border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);border:1px solid var(--border);padding:18px 14px;text-align:center;}
  .stat-card .value{font-size:24px;font-weight:800;color:var(--blue-900);line-height:1.25;}
  .stat-card.best .value{font-size:16px;}
  .stat-card .label{font-size:11px;color:var(--muted);font-weight:700;margin-top:6px;
    text-transform:uppercase;letter-spacing:.3px;}

  .period-toggle{display:flex;gap:6px;}
  .period-btn{background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:6px 14px;
    font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit;}
  .period-btn.active{background:var(--blue-700);border-color:var(--blue-700);color:#fff;}
  .chart-card{padding:18px 14px 8px;}
  .chart-svg{width:100%;height:auto;display:block;}
  .chart-bar{fill:var(--blue-600);}
  .chart-axis-label{font-size:9px;fill:var(--muted);font-family:'Plus Jakarta Sans',sans-serif;}
  .chart-empty{text-align:center;color:var(--muted);font-size:12.5px;padding:20px 0;}
  .top-client-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
  .top-client-card .rank{font-size:17px;font-weight:800;color:var(--gold-600);width:22px;flex-shrink:0;text-align:center;}
  .top-client-card .info{flex:1;min-width:0;}
  .top-client-card .nom{font-size:14px;font-weight:800;color:var(--text);}
  .top-client-card .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .top-client-card .total{font-size:14.5px;font-weight:800;color:var(--blue-900);white-space:nowrap;}
  .stuck-alert{background:#fdeceb;border:1px solid #f3c6c1;border-radius:var(--radius-md);
    padding:14px 16px;margin-bottom:14px;}
  .stuck-alert .title{font-size:13px;font-weight:800;color:var(--danger);margin-bottom:8px;}
  .stuck-alert .item{font-size:12.5px;color:var(--text);padding:6px 0;border-top:1px solid #f3c6c1;
    display:flex;justify-content:space-between;gap:10px;}
  .stuck-alert .item:first-of-type{border-top:none;}
  .stuck-alert .item .when{color:var(--muted);white-space:nowrap;}

  .driver-form-card{padding-bottom:18px;}
  .driver-form-row{display:flex;flex-direction:column;gap:12px;}
  .edit-row{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .edit-row input{padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:14px;font-family:inherit;background:#fbfcfe;}
  .edit-row input:focus{outline:none;border-color:var(--blue-600);}
  .assign-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .assign-row select{flex:1;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;
    font-size:12.5px;font-family:inherit;background:#fbfcfe;color:var(--text);}
  .btn-assign{background:var(--gold-500);color:#fff;flex:none;padding:9px 16px;border-radius:10px;
    font-size:12.5px;font-weight:800;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .btn-assign:disabled{opacity:.5;cursor:default;}

  .date-range-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .date-range-row .sep{color:var(--muted);font-size:12px;}
  .compta-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;}
  .compta-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .compta-card .nom{font-size:14.5px;font-weight:800;color:var(--text);}
  .compta-card .total{font-size:16px;font-weight:800;color:var(--blue-900);white-space:nowrap;}
  .compta-card .meta{font-size:12.5px;color:var(--muted);}
  .compta-total-row{background:linear-gradient(135deg,var(--blue-900),var(--blue-700));color:#fff;
    border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;
    align-items:center;box-shadow:var(--shadow-md);}
  .compta-total-row .label{font-size:12px;font-weight:700;color:var(--gold-400);}
  .compta-total-row .value{font-size:18px;font-weight:800;}

  .entry-form-card{padding-bottom:18px;}
  .entry-form-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .entry-form-ordre{display:flex;flex-direction:column;gap:6px;flex:none;}
  .entry-form-ordre input{width:80px;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:14px;font-family:inherit;background:#fbfcfe;}
  .entry-form-actif{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--blue-900);cursor:pointer;}
  .entry-form-actif input{width:18px;height:18px;}
  .list-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;display:flex;gap:12px;}
  .list-card .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg);flex-shrink:0;}
  .list-card .info{flex:1;min-width:0;}
  .list-card .nom{font-size:14.5px;font-weight:800;color:var(--text);}
  .list-card .texte{font-size:12.5px;color:var(--muted);margin:2px 0 6px;}
  .list-card .ordre{font-size:11.5px;color:var(--muted);font-weight:700;}
  .btn-edit{background:var(--blue-700);color:#fff;}
  .btn-delete{background:#fff;border-color:#f3c6c1;color:var(--danger);}

/* ============================================================
   APPEL API
   ============================================================ */
async function apiGet(params) {
  // Envoi en POST : mots de passe et codes PIN ne passent plus dans l'URL.
  const res = await fetch(CONFIG.API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(params)
  });
  const txt = await res.text();
  try { return JSON.parse(txt); }
  catch (e) { throw new Error("Réponse invalide du serveur"); }
}

   CONNEXION / SESSION
   ============================================================ */
function showError(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideError(box) {
  box.classList.remove("show");
  box.textContent = "";
}
function showSuccess(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideSuccess(box) {
  box.classList.remove("show");
  box.textContent = "";
}

$("loginBtn").addEventListener("click", doLogin);
$("fPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  hideError($("loginError"));
  if (!MTForm.validate($("loginScreen"))) return;
  const password = $("fPassword").value.trim();
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "...";
  try {
    const data = await apiGet({ action: "adminLogin", password: password });
    if (data.success) {
      SESSION_PASSWORD = password;
      SESSION_NAME = data.nom || null;
      localStorage.setItem(SESSION_KEY, password);
      if (SESSION_NAME) { localStorage.setItem(SESSION_NAME_KEY, SESSION_NAME); } else { localStorage.removeItem(SESSION_NAME_KEY); }
      enterApp();
    } else {
      showError($("loginError"), data.error || t("loginFailedGeneric"));
    }
  } catch (e) {
    showError($("loginError"), t("loginFailedGeneric"));
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = t("loginBtn");
  }
}

$("logoutBtn").addEventListener("click", () => {
  SESSION_PASSWORD = null;
  SESSION_NAME = null;
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_NAME_KEY);
  $("appScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("fPassword").value = "";
});

function todayStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function firstDayOfMonthStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-01";
}

function enterApp() {
  $("loginScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("whoText").textContent = SESSION_NAME ? (t("whoText") + " : " + SESSION_NAME) : t("whoText");
  $("ordersDate").value = todayStr();
  $("dashboardDate").value = todayStr();
  $("comptaDateStart").value = firstDayOfMonthStr();
  $("comptaDateEnd").value = todayStr();
  loadOrders();
  loadPendingItems();
  loadDrivers();
  loadPartners();
  loadDuplicates();
  loadBoostAdmin();
}

async function loadOrders() {

    const data = await apiGet({ action: "getAllOrders", password: SESSION_PASSWORD, date: date });

      if (data.error && /mot de passe|password/i.test(data.error)) {

function renderOrders() {

    ? ORDERS.map(orderCardHtml).join("")
    : emptyStateHtml(t("noOrders"), "📦");

  document.querySelectorAll("[data-action-order]").forEach(btn => {

function badgeInfo(statut) {
  const s = String(statut || "").trim();
  if (s === "À confirmer") return { cls: "aconfirmer", label: t("statutAconfirmer") };
  if (s === "En attente") return { cls: "enattente", label: t("statutEnattente") };
  if (s === "En livraison") return { cls: "enlivraison", label: t("statutEnlivraison") };
  if (s === "Livrée") return { cls: "livree", label: t("statutLivree") };
  if (s === "Annulée") return { cls: "annulee", label: t("statutAnnulee") };
  return { cls: "enattente", label: s };
}

function phoneToWaNumber(phone) {
  let digits = String(phone == null ? "" : phone).replace(/\D/g, "");
  digits = digits.replace(/^0+/, "");
  if (!digits) return "";
  if (digits.indexOf("213") === 0) return digits;
  return "213" + digits;
}

function actionsHtml(o) {
  const s = String(o.statut || "").trim();
  const numero = escapeAttr(o.numero);
  let buttons = "";
  if (s === "À confirmer") {
    buttons += `<button class="btn-action btn-confirm" type="button" data-action-order="${numero}" data-new-status="En attente">${escapeHtml(t("btnConfirm"))}</button>`;
    buttons += `<button class="btn-action btn-cancel" type="button" data-action-order="${numero}" data-new-status="Annulée">${escapeHtml(t("btnCancel"))}</button>`;
  } else if (s === "En attente" || s === "En livraison") {
    buttons += `<button class="btn-action btn-deliver" type="button" data-action-order="${numero}" data-new-status="Livrée">${escapeHtml(t("btnDeliver"))}</button>`;
    buttons += `<button class="btn-action btn-cancel" type="button" data-action-order="${numero}" data-new-status="Annulée">${escapeHtml(t("btnCancel"))}</button>`;
  }
  const waNumber = phoneToWaNumber(o.telephone);
  if (waNumber) {
    const msg = encodeURIComponent(t("waMsgIntro") + " N° " + (o.numero || ""));
    buttons += `<a class="btn-action btn-whatsapp" href="https://wa.me/${waNumber}?text=${msg}" target="_blank" rel="noopener">${escapeHtml(t("btnWhatsapp"))}</a>`;
  }
  return buttons ? `<div class="actions-row">${buttons}</div>` : "";
}

function assignRowHtml(o) {
  const s = String(o.statut || "").trim();
  if (s !== "En attente") return "";
  const activeDrivers = DRIVERS.filter(d => String(d.statut || "").trim().toLowerCase() === "actif");
  if (!activeDrivers.length) return "";
  const numero = escapeAttr(o.numero);
  const options = activeDrivers.map(d => {
    const suffix = d.enLivraison ? " (" + t("statusEnLivraison") + ")" : "";
    return `<option value="${escapeAttr(d.nom)}">${escapeHtml(d.nom + suffix)}</option>`;
  }).join("");
  return `
    <div class="assign-row">
      <select>
        <option value="">${escapeHtml(t("chooseDriverPlaceholder"))}</option>
        ${options}
      </select>
      <button class="btn-assign" type="button" data-assign-order="${numero}">${escapeHtml(t("btnAssign"))}</button>
    </div>
  `;
}

function orderCardHtml(o) {
  const b = badgeInfo(o.statut);
  return `
    <div class="order-card">
      <div class="row1">
        <div class="numero">${escapeHtml(o.numero || "")}</div>
        <div class="total">${escapeHtml(String(o.total || 0))} DA</div>
      </div>
      <div class="client">${escapeHtml(o.client || "")} · ${escapeHtml(fmtPhone(o.telephone))}</div>
      <div class="meta">${escapeHtml(o.adresse || "")} (${escapeHtml(o.zone || "")}) · ${escapeHtml(o.horodatage || "")}</div>
      <div class="articles">${escapeHtml(o.articles || "")}</div>
      <span class="badge ${b.cls}">${escapeHtml(b.label)}</span>
      ${actionsHtml(o)}

}

async function onAssignOrder(numero, driverName, btnEl) {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  if (!driverName) {
    showError($("errorBox"), t("chooseDriverPlaceholder"));
    return;
  }
  btnEl.disabled = true;
  try {
    const data = await apiGet({ action: "assignOrderToDriver", password: SESSION_PASSWORD, numero: numero, driverName: driverName });
    if (data.success) {
      const o = ORDERS.find(x => String(x.numero) === String(numero));
      if (o) o.statut = "En livraison";
      const item = DRIVERS.find(x => String(x.nom) === String(driverName));
      if (item) item.enLivraison = true;
      renderOrders();
      showSuccess($("successBox"), t("orderAssigned"));
    } else {
      showError($("errorBox"), data.error || t("assignFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("assignFailedGeneric"));
  } finally {
    btnEl.disabled = false;
  }
}

async function onUpdateStatus(orderNumber, newStatus, btnEl) {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  const allBtns = document.querySelectorAll("[data-action-order]");
  allBtns.forEach(b => b.disabled = true);
  try {
    const data = await apiGet({
      action: "updateOrderStatus",
      password: SESSION_PASSWORD,
      orderNumber: orderNumber,
      newStatus: newStatus
    });
    if (data.success) {
      const o = ORDERS.find(x => String(x.numero) === String(orderNumber));
      if (o) o.statut = newStatus;
      renderOrders();
    } else {
      showError($("errorBox"), data.error || t("updateFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("updateFailedGeneric"));
  } finally {
    document.querySelectorAll("[data-action-order]").forEach(b => b.disabled = false);
  }
}

function isPendingStatus(statut) {
  const s = String(statut || "").trim().toLowerCase();
  return s !== "actif" && s !== "refuse" && s !== "refusé";
}

function pendingRequests() {
  const reqs = [];
  DRIVERS.forEach(d => { if (isPendingStatus(d.statut)) reqs.push({ kind: "driver", item: d }); });
  PARTNERS.forEach(p => { if (isPendingStatus(p.statut)) reqs.push({ kind: "partner", item: p }); });
  return reqs;
}

async function onUpdateDriver(telephone, btnEl) {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  const nomEl = document.getElementById("editDriverNom_" + telephone);
  const zoneEl = document.getElementById("editDriverZone_" + telephone);
  const vehiculeEl = document.getElementById("editDriverVehicule_" + telephone);
  const nom = nomEl ? nomEl.value.trim() : "";
  const zone = zoneEl ? zoneEl.value.trim() : "";
  const vehicule = vehiculeEl ? vehiculeEl.value.trim() : "";
  if (!nom) {
    if (nomEl) MTForm.fail(nomEl, t("driverSaveRequired"));
    else showError($("errorBox"), t("driverSaveRequired"));
    return;
  }
  btnEl.disabled = true;
  try {
    const data = await apiGet({ action: "updateDriver", password: SESSION_PASSWORD, telephone: telephone, nom: nom, zone: zone, vehicule: vehicule });
    if (data.success) {
      const item = DRIVERS.find(x => String(x.telephone) === String(telephone));
      if (item) { item.nom = nom; item.zone = zone; item.vehicule = vehicule; }
      EDITING_DRIVER_TEL = null;
      renderDrivers();
      showSuccess($("successBox"), t("driverUpdated"));
    } else {
      showError($("errorBox"), data.error || t("updateDriverFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("updateDriverFailedGeneric"));
  } finally {
    btnEl.disabled = false;
  }
}

  hideError($("errorBox"));

function evalOpen(kind, tel) {
  const list = kind === "partner" ? PARTNERS : DRIVERS;
  const item = list.find(x => String(x.telephone) === String(tel));
  if (!item) return;
  EVAL = { kind: kind, item: item, detail: null };
  $("evalTitle").innerHTML = escapeHtml(item.nom || "") + " <span class=\"status-badge enattente\" style=\"margin:0 0 0 6px;\">" +
    escapeHtml(kind === "driver" ? t("kindDriver") : t("kindPartner")) + "</span>";
  $("evalModal").classList.remove("hidden");
  document.body.style.overflow = "hidden";
  evalRender("loading");
  apiGet({ action: "getRequestDetail", password: SESSION_PASSWORD, kind: kind, telephone: tel })
    .then(d => {
      if (!EVAL || EVAL.item !== item) return;
      if (d && d.success) { EVAL.detail = d; evalRender("form"); }
      else evalRender("error", (d && d.error) || t("evalLoadFailed"));
    })
    .catch(() => { if (EVAL && EVAL.item === item) evalRender("error", t("evalLoadFailed")); });
}

function evalClose() {
  $("evalModal").classList.add("hidden");
  document.body.style.overflow = "";
  EVAL = null;
}

function evalInfoHtml() {
  const x = EVAL.item;
  const rows = [];
  (EVAL.detail.fields || []).forEach(f => rows.push([f.label, f.value]));
  if (!rows.length) {
    rows.push([EVAL.kind === "driver" ? t("kindDriver") : t("kindPartner"), x.nom || ""]);
  }
  // Le téléphone (avec son 0 initial) est toujours montré en premier.
  const tel = fmtPhone(x.telephone);
  const body = rows.map(r => {
    const isPhone = /t[ée]l[ée]?phone|هاتف/i.test(r[0]);
    return `<div class="eval-row"><div class="k">${escapeHtml(r[0])}</div><div class="v">${isPhone ? `<span dir="ltr">${escapeHtml(tel)}</span>` : escapeHtml(r[1])}</div></div>`;
  }).join("");
  return `<div class="eval-info">${body}</div>`;
}

function evalRender(state, extra) {
  const body = $("evalBody");
  if (state === "loading") {
    body.innerHTML = `<div class="eval-loading">${escapeHtml(t("evalLoading"))}</div>`;
    return;
  }
  if (state === "error") {
    body.innerHTML = `<div class="eval-err">${escapeHtml(extra || t("evalLoadFailed"))}</div>
      <div class="actions-row"><button class="btn-action btn-refuse" type="button" data-eval-act="close">${escapeHtml(t("evalClose"))}</button></div>`;
    return;
  }
  if (state === "form") {
    const email = (EVAL.detail && EVAL.detail.email) || "";
    body.innerHTML = `
      <div class="subheading" style="margin-top:0;">${escapeHtml(t("evalInfoTitle"))}</div>
      ${evalInfoHtml()}
      <label class="eval-label" for="evalEmail">${escapeHtml(t("evalEmailLabel"))}</label>
      <input class="eval-field" id="evalEmail" type="email" inputmode="email" autocomplete="off" value="${escapeAttr(email)}" dir="ltr">
      <div class="eval-note">${escapeHtml(t("evalAcceptHint"))}</div>
      <div id="evalMsg"></div>
      <div class="actions-row">
        <button class="btn-action btn-activate" type="button" data-eval-act="accept">${escapeHtml(t("evalAccept"))}</button>
        <button class="btn-action btn-refuse" type="button" data-eval-act="refuse-form">${escapeHtml(t("evalRefuse"))}</button>
      </div>`;
    return;
  }
  if (state === "refuse") {
    const email = ($("evalEmail") && $("evalEmail").value) || (EVAL.detail && EVAL.detail.email) || "";
    EVAL.emailDraft = email;
    body.innerHTML = `
      <label class="eval-label" for="evalReason">${escapeHtml(t("evalReasonLabel"))}</label>
      <textarea class="eval-field" id="evalReason" maxlength="400" placeholder="${escapeAttr(t("evalReasonPh"))}"></textarea>
      <label class="eval-label" for="evalEmail">${escapeHtml(t("evalEmailLabel"))}</label>
      <input class="eval-field" id="evalEmail" type="email" inputmode="email" autocomplete="off" value="${escapeAttr(email)}" dir="ltr">
      <div id="evalMsg"></div>
      <div class="actions-row">
        <button class="btn-action btn-refuse" type="button" data-eval-act="refuse">${escapeHtml(t("evalConfirmRefuse"))}</button>
        <button class="btn-action btn-cancel" type="button" data-eval-act="back" style="color:var(--muted);border-color:var(--border);">${escapeHtml(t("evalBack"))}</button>
      </div>`;
    setTimeout(() => { const r = $("evalReason"); if (r) r.focus(); }, 30);
    return;
  }
  if (state === "done") {
    const r = extra;
    const lines = [];
    lines.push(`<div class="${r.decision === "accept" ? "eval-ok" : "eval-note"}" style="${r.decision === "accept" ? "" : "font-weight:800;color:var(--text);"}">${escapeHtml(r.decision === "accept" ? t("evalDoneAccept") : t("evalDoneRefuse"))}</div>`);
    if (r.decision === "accept") {
      if (EVAL.kind === "partner" && r.pin) lines.push(`<div class="eval-note">${escapeHtml(t("evalPinGenerated"))}<b>${escapeHtml(r.pin)}</b></div>`);
      if (EVAL.kind === "driver") lines.push(`<div class="eval-note">${escapeHtml(t("evalPinKept"))}</div>`);
    } else {
      lines.push(`<div class="eval-note">${escapeHtml(t("evalReasonFor"))}${escapeHtml(r.motif)}</div>`);
    }
    if (r.emailSent) lines.push(`<div class="eval-note">✉️ ${escapeHtml(t("evalEmailSent"))}<span dir="ltr">${escapeHtml(r.email)}</span></div>`);
    else if (r.email) lines.push(`<div class="eval-note">${escapeHtml(t("evalEmailFailed"))}</div>`);
    else lines.push(`<div class="eval-note">${escapeHtml(t("evalEmailNone"))}</div>`);
    const wa = phoneToWaNumber(EVAL.item.telephone);
    const waBtn = wa
      ? `<a class="btn-action btn-whatsapp" href="https://wa.me/${wa}?text=${encodeURIComponent(r.waText)}" target="_blank" rel="noopener">${escapeHtml(t("evalSendWa"))}</a>`
      : "";
    body.innerHTML = lines.join("") + `<div class="actions-row">${waBtn}<button class="btn-action btn-cancel" type="button" data-eval-act="close" style="color:var(--muted);border-color:var(--border);">${escapeHtml(t("evalClose"))}</button></div>`;
  }
}

function evalShowErr(msg) {
  const box = $("evalMsg");
  if (box) box.innerHTML = msg ? `<div class="eval-err">${escapeHtml(msg)}</div>` : "";
}

async function evalDecide(decision) {
  if (!EVAL) return;
  const x = EVAL.item, kind = EVAL.kind;
  const emailEl = $("evalEmail");
  const email = emailEl ? emailEl.value.trim() : "";
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { evalShowErr(t("evalEmailInvalid")); return; }
  let motif = "";
  if (decision === "refuse") {
    motif = ($("evalReason") ? $("evalReason").value : "").trim();
    if (!motif) { evalShowErr(t("evalReasonRequired")); return; }
  }
  const nom = String(x.nom || "").trim();
  const isAccept = decision === "accept";
  const subject = isAccept ? "MT Delivery – Demande acceptée / تم قبول طلبكم" : "MT Delivery – Réponse à votre demande / رد على طلبكم";
  const emailBody = isAccept ? evalAcceptMsg(kind, nom, x.telephone, "{PIN}") : evalRefuseMsg(kind, nom, motif);
  document.querySelectorAll("#evalBody .btn-action").forEach(b => { b.disabled = true; });
  evalShowErr("");
  try {
    const d = await apiGet({
      action: "decideRequest", password: SESSION_PASSWORD, kind: kind, telephone: x.telephone,
      decision: decision, motif: motif, email: email, subject: subject, body: emailBody
    });
    if (!d || !d.success) {
      document.querySelectorAll("#evalBody .btn-action").forEach(b => { b.disabled = false; });
      evalShowErr((d && d.error) || t("evalFailed"));
      return;
    }
    x.statut = isAccept ? "Actif" : "Refuse";
    let pin = d.pin || "";
    if (kind === "partner") {
      if (d.pin) x.pin = d.pin;
      pin = x.pin || "";
    }
    if (kind === "partner") renderPartners(); else renderDrivers();
    updateRequestsUi();
    const waText = isAccept ? evalAcceptMsg(kind, nom, x.telephone, pin || "—") : evalRefuseMsg(kind, nom, motif);
    evalRender("done", { decision: decision, pin: d.pin || "", motif: motif, email: email || "", emailSent: !!d.emailSent, waText: waText });
  } catch (e) {
    document.querySelectorAll("#evalBody .btn-action").forEach(b => { b.disabled = false; });
    evalShowErr(t("evalFailed"));
  }
}

$("evalX").addEventListener("click", evalClose);
$("evalModal").addEventListener("click", (e) => { if (e.target === $("evalModal")) evalClose(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && EVAL) evalClose(); });
$("evalBody").addEventListener("click", (e) => {
  const b = e.target.closest("[data-eval-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.evalAct;
  if (a === "close") evalClose();
  else if (a === "accept") evalDecide("accept");
  else if (a === "refuse-form") evalRender("refuse");
  else if (a === "refuse") evalDecide("refuse");
  else if (a === "back") evalRender("form");
});

function parseArticlesText(articlesText) {
  const result = [];
  String(articlesText || "").split("|").forEach(part => {
    const m = part.trim().match(/^(\d+)\s*x\s+(.+?)\s*\(/i);
    if (m) {
      result.push({ qty: parseInt(m[1], 10) || 0, nom: m[2].trim() });
    }
  });
  return result;
}

function renderDashboard() {
  const valid = DASHBOARD_ORDERS.filter(o => String(o.statut || "").trim() !== "Annulée");
  const nbCommandes = valid.length;
  const totalDA = valid.reduce((sum, o) => sum + (Number(o.total) || 0), 0);

  const dishCounts = {};
  valid.forEach(o => {
    parseArticlesText(o.articles).forEach(item => {
      dishCounts[item.nom] = (dishCounts[item.nom] || 0) + item.qty;
    });
  });
  let bestDish = null, bestQty = 0;
  Object.keys(dishCounts).forEach(nom => {
    if (dishCounts[nom] > bestQty) { bestQty = dishCounts[nom]; bestDish = nom; }
  });

  const bestLabel = bestDish
    ? escapeHtml(t("statBestDish")) + " (" + bestQty + ")"
    : escapeHtml(t("statBestDish"));

  $("dashboardStats").innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="value">${nbCommandes}</div>
        <div class="label">${escapeHtml(t("statNbOrders"))}</div>

}

function evolutionChartSvg(daily) {
  const w = 300, h = 120, padBottom = 16, padTop = 6;
  const maxVal = Math.max.apply(null, daily.map(d => d.totalDA || 0));
  if (!maxVal) return `<div class="chart-empty">${escapeHtml(t("chartEmpty"))}</div>`;
  const n = daily.length;
  const gap = 2;
  const barW = (w - gap * (n - 1)) / n;
  const bars = daily.map((d, i) => {
    const val = d.totalDA || 0;
    const barH = Math.max(1, Math.round((val / maxVal) * (h - padBottom - padTop)));
    const x = i * (barW + gap);
    const y = h - padBottom - barH;
    const dt = new Date(d.date + "T00:00:00");
    const label = String(dt.getDate()).padStart(2, "0") + "/" + String(dt.getMonth() + 1).padStart(2, "0");
    const showLabel = n <= 10 || i % Math.ceil(n / 10) === 0;
    return `
      <rect class="chart-bar" x="${x.toFixed(1)}" y="${y}" width="${barW.toFixed(1)}" height="${barH}" rx="2">
        <title>${escapeHtml(label)} : ${val.toLocaleString("fr-FR")} DA</title>
      </rect>
      ${showLabel ? `<text class="chart-axis-label" x="${(x + barW / 2).toFixed(1)}" y="${h - 3}" text-anchor="middle">${escapeHtml(label)}</text>` : ""}
    `;
  }).join("");
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img">${bars}</svg>`;
}

  try {

    if (data.success) {

    }
  } catch (e) {

  }

function boostMatches(r, f) {
  if (f === "all") return true;
  if (f === "pending") return r.etat === "en_attente";
  if (f === "live") return r.etat === "active";
  if (f === "planned") return r.etat === "planifiee" || r.etat === "approuvee";
  if (f === "returned") return r.etat === "a_modifier";
  if (f === "done") return r.etat === "expiree" || r.etat === "refusee" || r.etat === "suspendue";
  return true;
}

function boostBadgeCls(r) {
  if (r.etat === "active") return "actif";
  if (r.etat === "refusee") return "refuse";
  return "enattente";
}

function boostCardHtml(r) {
  const id = escapeAttr(r.id);
  const price = r.prixPlat === "" || r.prixPlat == null ? "" : ` · ${Number(r.prixPlat).toLocaleString("fr-FR")} DA`;
  const period = r.debut && r.fin ? `<div>${escapeHtml(t("boostPeriod"))} : ${escapeHtml(r.debut)} → ${escapeHtml(r.fin)}</div>` : "";
  const paid = r.statut === "approuvee"
    ? `<span class="status-badge ${r.paye ? "actif" : "enattente"}">${escapeHtml(r.paye ? t("boostPaid") : t("boostUnpaid"))}</span>` : "";
  let actions = "";
  if (r.etat === "en_attente") {
    actions = `
      <div class="boost-form" data-mtform data-note-before=".actions-row">
        <label class="mt-req" for="bdebut_${id}">${escapeHtml(t("boostStartLabel"))}</label>
        <input type="date" class="b-debut" id="bdebut_${id}" aria-required="true" value="${escapeAttr(r.debutSouhaite || "")}">
        <label class="boost-check"><input type="checkbox" class="b-paye"> ${escapeHtml(t("boostPaidNow"))}</label>
        <label class="mt-req" for="bcomment_${id}">${escapeHtml(t("boostCommentLabel"))}</label>
        <textarea class="b-comment" id="bcomment_${id}" aria-required="true"></textarea>
        <div class="actions-row">
          <button class="btn-action btn-activate" type="button" data-bact="approve" data-bid="${id}">${escapeHtml(t("boostAccept"))}</button>
          <button class="btn-action btn-confirm" type="button" data-bact="modify" data-bid="${id}">${escapeHtml(t("boostReturn"))}</button>
          <button class="btn-action btn-refuse" type="button" data-bact="refuse" data-bid="${id}">${escapeHtml(t("boostReject"))}</button>
        </div>
      </div>`;
  } else if (r.statut === "approuvee") {
    const live = r.etat !== "expiree";
    actions = `<div class="actions-row">
      <button class="btn-action btn-confirm" type="button" data-bact="pay" data-bid="${id}" data-pay="${r.paye ? "NON" : "OUI"}">${escapeHtml(r.paye ? t("boostMarkUnpaid") : t("boostMarkPaid"))}</button>
      ${live ? `<button class="btn-action ${r.suspendue ? "btn-activate" : "btn-refuse"}" type="button" data-bact="suspend" data-bid="${id}" data-susp="${r.suspendue ? "NON" : "OUI"}">${escapeHtml(r.suspendue ? t("boostReactivate") : t("boostSuspend"))}</button>` : ""}
    </div>`;
  }
  const comment = r.commentaire && r.etat !== "en_attente" ? `<div class="boost-meta">💬 ${escapeHtml(r.commentaire)}</div>` : "";
  return `
    <div class="boost-card" data-card="${id}">
      <div class="boost-head">
        <img class="boost-thumb" src="${escapeAttr(r.imageUrl)}" alt="" loading="lazy">
        <div class="boost-main">
          <div class="nom">${escapeHtml(r.nomPlat)}${escapeHtml(price)}</div>
          <div class="boost-meta">
            <div>${escapeHtml(t("boostRestaurant"))} : <b>${escapeHtml(r.restaurant)}</b> · ${escapeHtml(fmtPhone(r.telephone))}</div>
            <div>${escapeHtml(r.id)} · ${escapeHtml(t("boostDuration"))} : ${r.dureeJours} · ${Number(r.prixDA).toLocaleString("fr-FR")} DA</div>
            <div>${escapeHtml(t("boostWishedStart"))} : ${escapeHtml(r.debutSouhaite)}</div>
            ${period}
            ${r.texte ? `<div>« ${escapeHtml(r.texte)} »</div>` : ""}
          </div>
          <span class="status-badge ${boostBadgeCls(r)}">${escapeHtml(t("bst_" + r.etat))}</span> ${paid}
        </div>
      </div>
      ${comment}
      ${actions}
      <div class="actions-row"><button class="btn-action" type="button" data-bact="history" data-bid="${id}">${escapeHtml(t("boostHistory"))}</button></div>
      <div class="boost-hist hidden" data-hist="${id}"></div>
    </div>`;
}

function renderBoostAdmin() {
  const list = $("listBoostAdmin");
  if (!list) return;
  const pending = BOOST_REQS.filter(r => r.etat === "en_attente").length;
  const live = BOOST_REQS.filter(r => r.etat === "active").length;
  const cash = BOOST_REQS.filter(r => r.statut === "approuvee" && r.paye).reduce((a, r) => a + Number(r.prixDA || 0), 0);
  const badge = $("boostBadge");
  badge.textContent = pending;
  badge.classList.toggle("hidden", pending === 0);
  $("boostSummary").innerHTML =
    `<span>${escapeHtml(t("boostSumLive"))} : ${live}/${BOOST_MAX}</span>` +
    `<span>${escapeHtml(t("boostSumPending"))} : ${pending}</span>` +
    `<span>${escapeHtml(t("boostSumCash"))} : ${cash.toLocaleString("fr-FR")} DA</span>`;
  const f = $("boostFilter").value || "pending";
  const rows = BOOST_REQS.filter(r => boostMatches(r, f));
  list.innerHTML = rows.length ? rows.map(boostCardHtml).join("") : emptyStateHtml(t("boostNone"), "📣");
  if (window.MTForm) MTForm.refresh(list);
}

$("listBoostAdmin").addEventListener("click", async ev => {
  const btn = ev.target.closest("[data-bact]");
  if (!btn) return;
  const act = btn.getAttribute("data-bact");
  const id = btn.getAttribute("data-bid");
  const card = btn.closest(".boost-card");
  hideError($("errorBox"));
  hideSuccess($("successBox"));

  if (act === "history") {
    const box = card.querySelector("[data-hist]");
    if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
    box.textContent = "...";
    box.classList.remove("hidden");
    try {
      const d = await apiGet({ action: "getPubHistory", password: SESSION_PASSWORD, id: id });
      const h = d.success ? d.history : [];
      box.innerHTML = h.length
        ? h.map(x => `${escapeHtml(x.date)} · ${escapeHtml(x.acteur)} · <b>${escapeHtml(x.action)}</b>${x.commentaire ? " · " + escapeHtml(x.commentaire) : ""}`).join("<br>")
        : escapeHtml(t("boostNoHistory"));
    } catch (e) { box.textContent = t("boostFailed"); }
    return;
  }

  let params;
  if (act === "pay") {
    params = { action: "setPubPaid", password: SESSION_PASSWORD, id: id, paye: btn.getAttribute("data-pay") };
  } else if (act === "suspend") {
    params = { action: "setPubSuspended", password: SESSION_PASSWORD, id: id, suspendue: btn.getAttribute("data-susp") };
  } else {
    const comment = card.querySelector(".b-comment").value.trim();
    MTForm.clearAll(card);
    if (act === "approve" && !card.querySelector(".b-debut").value) {
      MTForm.fail(card.querySelector(".b-debut"), t("boostStartRequired"));
      return;
    }
    if ((act === "modify" || act === "refuse") && !comment) {
      MTForm.fail(card.querySelector(".b-comment"), t("boostCommentRequired"));
      return;
    }
    params = { action: "decidePubRequest", password: SESSION_PASSWORD, id: id, decision: act, comment: comment,
      debut: card.querySelector(".b-debut").value, paye: card.querySelector(".b-paye").checked ? "OUI" : "NON" };
  }
  btn.disabled = true;
  try {
    const d = await apiGet(params);
    if (d.success) {
      showSuccess($("successBox"), act === "pay" || act === "suspend" ? t("boostUpdated") : t("boostDone"));
      await loadBoostAdmin();
    } else {
      showError($("errorBox"), d.error || t("boostFailed"));
    }
  } catch (e) {
    showError($("errorBox"), t("boostFailed"));
  } finally {
    btn.disabled = false;
  }
});

/* ============================================================
   UTILITAIRES
   ============================================================ */
function emptyStateHtml(msg, emoji) {
  return `<div class="empty-state"><span class="emoji">${emoji || "📦"}</span>${escapeHtml(msg)}</div>`;
}
/* Téléphone : Google Sheets perd le 0 initial des numéros enregistrés comme nombres. */
function fmtPhone(v) {
  let d = String(v == null ? "" : v).replace(/[^\d+]/g, "");
  if (!d) return "";
  if (/^\+?213\d{8,9}$/.test(d)) d = "0" + d.replace(/^\+?213/, "");
  else if (/^\d{8,9}$/.test(d) && d[0] !== "0") d = "0" + d;
  return /^0\d{9}$/.test(d) ? d.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})$/, "$1 $2 $3 $4") : d;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ============================================================
   DÉMARRAGE
   ============================================================ */
applyLanguage();
if (SESSION_PASSWORD) {
  enterApp();
}
</script>
