<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a2647">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MT Delivery">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="robots" content="noindex, nofollow">
<title>MT Delivery — Espace admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0a2647;
    --blue-800:#0f3562;
    --blue-700:#134a8f;
    --blue-600:#1a5cb0;
    --blue-100:#e9f1fb;
    --gold-600:#b8860f;
    --gold-500:#d4a017;
    --gold-400:#e8bb3d;
    --gold-100:#fdf3d9;
    --bg:#f3f5f9;
    --card:#ffffff;
    --text:#131b28;
    --muted:#69748a;
    --danger:#c0392b;
    --green:#1a7d3a;
    --border:#e6eaf1;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --shadow-md:0 6px 20px -6px rgba(16,36,72,.16);
    --shadow-lg:0 20px 40px -12px rgba(10,38,71,.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:40px;-webkit-font-smoothing:antialiased;}
  html[dir="rtl"] body{font-family:'Tajawal','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  a{color:inherit;}
  ::selection{background:var(--gold-100);color:var(--blue-900);}

  header.top{
    background:#ffffff;
    padding:20px 0 22px;position:relative;overflow:hidden;
    border-bottom:1px solid var(--border);text-align:center;
  }
  header.top .brand{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;width:100%;}
  header.top .brand .logo-img{height:auto;width:100%;max-width:280px;display:block;margin:0 auto;}
  header.top .tagline{font-size:13px;color:var(--blue-700);font-weight:700;letter-spacing:.2px;}
  .lang-toggle{
    position:absolute;top:14px;right:14px;z-index:2;
    background:#fff;border:1.5px solid var(--gold-500);color:var(--blue-900);
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;
    font-family:inherit;
  }
  html[dir="rtl"] .lang-toggle{right:auto;left:14px;}

  main{max-width:640px;margin:0 auto;padding:20px 16px 40px;}

  .card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:22px;margin-bottom:16px;}

  /* Écran de connexion */
  .login-card h2{margin:0 0 6px;font-size:19px;color:var(--blue-900);font-weight:800;}
  .login-card p{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.6;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--blue-900);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;font-family:inherit;background:#fbfcfe;transition:border-color .15s ease;
  }
  .field input:focus{outline:none;border-color:var(--blue-600);}
  .btn-primary{
    width:100%;background:linear-gradient(135deg,var(--blue-700),var(--blue-900));color:#fff;border:none;
    border-radius:13px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;
  }
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .error-box{background:#fdeceb;border:1px solid #f3c6c1;color:var(--danger);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:13px;margin-top:12px;line-height:1.5;display:none;}
  .error-box.show{display:block;}
  .success-box{background:#eaf7ee;border:1px solid #bfe6c9;color:var(--green);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:13px;margin-top:12px;line-height:1.5;display:none;}
  .success-box.show{display:block;}

  /* En-tête connecté */
  .session-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(135deg,var(--blue-900),var(--blue-700));color:#fff;border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-md);}
  .session-bar .who{font-size:14px;font-weight:800;}
  .session-bar .zone{font-size:12px;color:var(--gold-400);font-weight:600;}
  .btn-logout{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}

  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .btn-refresh{background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 14px;
    font-size:12.5px;font-weight:700;color:var(--blue-700);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .date-input{border:1.5px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12.5px;
    font-family:inherit;color:var(--blue-900);background:#fff;}

  .order-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;}
  .order-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .order-card .numero{font-size:11.5px;font-weight:800;color:var(--gold-600);letter-spacing:.3px;}
  .order-card .total{font-size:16px;font-weight:800;color:var(--blue-900);}
  .order-card .meta{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:4px;}
  .order-card .client{font-size:14.5px;font-weight:700;color:var(--text);}
  .order-card .articles{font-size:13px;color:var(--text);background:var(--bg);border-radius:var(--radius-sm);
    padding:8px 10px;margin:8px 0;line-height:1.5;}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 10px;margin:6px 0;}
  .badge.aconfirmer{background:var(--gold-100);color:var(--gold-600);}
  .badge.enattente{background:#e9f1fb;color:var(--blue-700);}
  .badge.enlivraison{background:#e9f1fb;color:var(--blue-700);}
  .badge.livree{background:#eaf7ee;color:var(--green);}
  .badge.annulee{background:#fdeceb;color:var(--danger);}

  .actions-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .btn-action{flex:1;min-width:110px;border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:800;
    cursor:pointer;font-family:inherit;border:1.5px solid transparent;text-align:center;text-decoration:none;display:inline-block;}
  .btn-confirm{background:var(--blue-700);color:#fff;}
  .btn-cancel{background:#fff;border-color:#f3c6c1;color:var(--danger);}
  .btn-deliver{background:var(--green);color:#fff;}
  .btn-whatsapp{background:#25D366;color:#fff;}
  .btn-action:disabled{opacity:.5;cursor:default;}

  .empty-state{text-align:center;color:var(--muted);font-size:13.5px;padding:40px 20px;}
  .empty-state .emoji{font-size:32px;display:block;margin-bottom:10px;}

  .tab-bar{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:9px 10px;
    font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit;position:relative;}
  .tab-btn.active{background:var(--blue-700);border-color:var(--blue-700);color:#fff;}
  .mod-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;
    font-weight:800;border-radius:999px;padding:2px 6px;min-width:16px;line-height:1.4;}
  html[dir="rtl"] .mod-badge{right:auto;left:-6px;}

  .dish-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;display:flex;gap:12px;}
  .dish-card img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg);flex-shrink:0;}
  .dish-card .info{flex:1;min-width:0;}
  .dish-card .nom{font-size:14.5px;font-weight:800;color:var(--text);}
  .dish-card .meta{font-size:12.5px;color:var(--muted);margin:2px 0 6px;}
  .dish-card .prix{font-size:14px;font-weight:800;color:var(--blue-900);margin-bottom:8px;}
  .btn-publish{background:var(--green);color:#fff;}
  .btn-reject{background:#fff;border-color:#f3c6c1;color:var(--danger);}

  .subheading{font-size:12.5px;font-weight:800;color:var(--blue-900);margin:16px 0 10px;
    text-transform:uppercase;letter-spacing:.4px;}
  .subheading:first-child{margin-top:2px;}
  .partner-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;}
  .partner-card .nom{font-size:14.5px;font-weight:800;color:var(--text);}
  .partner-card .meta{font-size:12.5px;color:var(--muted);margin:2px 0 8px;}
  .status-badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 10px;margin-bottom:10px;}
  .status-badge.actif{background:#eaf7ee;color:var(--green);}
  .status-badge.enattente{background:var(--gold-100);color:var(--gold-600);}
  .status-badge.refuse{background:#fdeceb;color:var(--danger);}
  .btn-activate{background:var(--green);color:#fff;}
  .btn-deactivate{background:#fff;border-color:#f3c6c1;color:var(--danger);}
  .pin-row{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .pin-row input{width:90px;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fbfcfe;letter-spacing:2px;text-align:center;}
  .pin-row input:focus{outline:none;border-color:var(--blue-600);}
  .btn-savepin{background:var(--blue-700);color:#fff;flex:none;padding:8px 14px;}

  .stats-row{display:flex;gap:10px;flex-wrap:wrap;}
  .stat-card{flex:1;min-width:140px;background:var(--card);border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);border:1px solid var(--border);padding:18px 14px;text-align:center;}
  .stat-card .value{font-size:24px;font-weight:800;color:var(--blue-900);line-height:1.25;}
  .stat-card.best .value{font-size:16px;}
  .stat-card .label{font-size:11px;color:var(--muted);font-weight:700;margin-top:6px;
    text-transform:uppercase;letter-spacing:.3px;}

  .date-range-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .date-range-row .sep{color:var(--muted);font-size:12px;}
  .compta-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;}
  .compta-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .compta-card .nom{font-size:14.5px;font-weight:800;color:var(--text);}
  .compta-card .total{font-size:16px;font-weight:800;color:var(--blue-900);white-space:nowrap;}
  .compta-card .meta{font-size:12.5px;color:var(--muted);}
  .compta-total-row{background:linear-gradient(135deg,var(--blue-900),var(--blue-700));color:#fff;
    border-radius:var(--radius-md);padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;
    align-items:center;box-shadow:var(--shadow-md);}
  .compta-total-row .label{font-size:12px;font-weight:700;color:var(--gold-400);}
  .compta-total-row .value{font-size:18px;font-weight:800;}

  .ad-form-card{padding-bottom:18px;}
  .ad-form-row{display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .ad-form-ordre{display:flex;flex-direction:column;gap:6px;flex:none;}
  .ad-form-ordre input{width:80px;padding:10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:14px;font-family:inherit;background:#fbfcfe;}
  .ad-form-actif{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--blue-900);cursor:pointer;}
  .ad-form-actif input{width:18px;height:18px;}
  .ad-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;display:flex;gap:12px;}
  .ad-card .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg);flex-shrink:0;}
  .ad-card .info{flex:1;min-width:0;}
  .ad-card .nom{font-size:14.5px;font-weight:800;color:var(--text);}
  .ad-card .texte{font-size:12.5px;color:var(--muted);margin:2px 0 6px;}
  .ad-card .ordre{font-size:11.5px;color:var(--muted);font-weight:700;}
  .btn-edit{background:var(--blue-700);color:#fff;}
  .btn-delete{background:#fff;border-color:#f3c6c1;color:var(--danger);}

  .hidden{display:none !important;}

  .footer-note{max-width:960px;margin:24px auto 0;padding:0 16px;text-align:center;
    color:var(--muted);font-size:11.5px;font-weight:500;}
</style>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function (err) {
      console.warn("Service worker non enregistré :", err);
    });
  });
}
</script>
</head>
<body>

<header class="top">
  <div class="brand">
    <a href="index.html" aria-label="Retour à l'accueil" style="display:block;"><img class="logo-img" src="logo.png" alt="MT Delivery" width="316" height="158" loading="eager"></a>
    <div class="tagline" id="tagline">Espace admin</div>
  </div>
  <button class="lang-toggle" id="langToggle" type="button">AR</button>
</header>

<main>

  <!-- ================= ÉCRAN DE CONNEXION ================= -->
  <section id="loginScreen" class="card login-card">
    <h2 id="loginTitle">Connexion admin</h2>
    <p id="loginSubtitle">Entre le mot de passe administrateur.</p>
    <div class="field">
      <label id="lblPassword">Mot de passe</label>
      <input type="password" id="fPassword" placeholder="••••••••" autocomplete="off">
    </div>
    <button class="btn-primary" id="loginBtn" type="button">Se connecter</button>
    <div class="error-box" id="loginError"></div>
  </section>

  <!-- ================= ESPACE CONNECTÉ ================= -->
  <div id="appScreen" class="hidden">

    <div class="session-bar">
      <div>
        <div class="who" id="whoText"></div>
      </div>
      <button class="btn-logout" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div id="errorBox" class="error-box"></div>
    <div id="successBox" class="success-box"></div>

    <div class="tab-bar" id="tabBar">
      <button class="tab-btn active" id="tabOrdersBtn" type="button"><span id="tabOrdersLabel"></span></button>
      <button class="tab-btn" id="tabModerationBtn" type="button"><span id="tabModerationLabel"></span><span id="modBadge" class="mod-badge hidden">0</span></button>
      <button class="tab-btn" id="tabPartnersBtn" type="button"><span id="tabPartnersLabel"></span></button>
      <button class="tab-btn" id="tabDashboardBtn" type="button"><span id="tabDashboardLabel"></span></button>
      <button class="tab-btn" id="tabComptaBtn" type="button"><span id="tabComptaLabel"></span></button>
      <button class="tab-btn" id="tabPubBtn" type="button"><span id="tabPubLabel"></span></button>
    </div>

    <div id="ordersView">
      <div class="refresh-row">
        <input type="date" class="date-input" id="ordersDate">
        <button class="btn-refresh" id="refreshBtn" type="button"><span id="refreshLabel">↻ Actualiser</span></button>
      </div>
      <div id="listOrders"></div>
    </div>

    <div id="moderationView" class="hidden">
      <div class="refresh-row">
        <div></div>
        <button class="btn-refresh" id="refreshModBtn" type="button"><span id="refreshModLabel">↻ Actualiser</span></button>
      </div>
      <div id="listModeration"></div>
    </div>

    <div id="partnersView" class="hidden">
      <div class="refresh-row">
        <div></div>
        <button class="btn-refresh" id="refreshPartnersBtn" type="button"><span id="refreshPartnersLabel">↻ Actualiser</span></button>
      </div>
      <div class="subheading" id="subheadingPartners"></div>
      <div id="listPartners"></div>
      <div class="subheading" id="subheadingDrivers"></div>
      <div id="listDrivers"></div>
    </div>

    <div id="dashboardView" class="hidden">
      <div class="refresh-row">
        <input type="date" class="date-input" id="dashboardDate">
        <button class="btn-refresh" id="refreshDashboardBtn" type="button"><span id="refreshDashboardLabel">↻ Actualiser</span></button>
      </div>
      <div id="dashboardStats"></div>
    </div>

    <div id="comptaView" class="hidden">
      <div class="refresh-row" style="flex-wrap:wrap;">
        <div class="date-range-row">
          <input type="date" class="date-input" id="comptaDateStart">
          <span class="sep">→</span>
          <input type="date" class="date-input" id="comptaDateEnd">
        </div>
        <button class="btn-refresh" id="refreshComptaBtn" type="button"><span id="refreshComptaLabel">↻ Actualiser</span></button>
      </div>
      <div id="comptaTotalRow"></div>
      <div id="listCompta"></div>
    </div>

    <div id="pubView" class="hidden">
      <div class="refresh-row">
        <div></div>
        <button class="btn-refresh" id="refreshPubBtn" type="button"><span id="refreshPubLabel">↻ Actualiser</span></button>
      </div>
      <div class="card ad-form-card">
        <div class="subheading" id="adFormTitle" style="margin-top:0;"></div>
        <input type="hidden" id="adFormId" value="">
        <div class="field">
          <label id="lblAdNom"></label>
          <input type="text" id="adFormNom" placeholder="">
        </div>
        <div class="field">
          <label id="lblAdImage"></label>
          <input type="text" id="adFormImage" placeholder="https://...">
        </div>
        <div class="field">
          <label id="lblAdLien"></label>
          <input type="text" id="adFormLien" placeholder="https://...">
        </div>
        <div class="field">
          <label id="lblAdTexte"></label>
          <input type="text" id="adFormTexte" placeholder="">
        </div>
        <div class="field ad-form-row">
          <div class="ad-form-ordre">
            <label id="lblAdOrdre"></label>
            <input type="number" id="adFormOrdre" value="0" min="0" step="1">
          </div>
          <label class="ad-form-actif">
            <input type="checkbox" id="adFormActif" checked>
            <span id="lblAdActif"></span>
          </label>
        </div>
        <div class="actions-row">
          <button class="btn-action btn-confirm" id="adFormSaveBtn" type="button"></button>
          <button class="btn-action btn-cancel hidden" id="adFormCancelBtn" type="button"></button>
        </div>
      </div>
      <div class="subheading" id="subheadingAds"></div>
      <div id="listAds"></div>
    </div>

  </div>

</main>

<div class="footer-note" id="footerNote">MT Delivery · Meftah, Blida</div>

<script>
/* ============================================================
   CONFIGURATION
   ============================================================ */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbwgXOyXERonv0Yk7X-uhoHuE1Fj26RiYHPR4Tnr7Z_1Ly8wWjsvlE5sp3JJRukRR4ZF/exec"
};

const LANG_KEY = "mtd_espace_admin_lang";
const SESSION_KEY = "mtd_espace_admin_session";
const SESSION_NAME_KEY = "mtd_espace_admin_session_nom";
let LANG = localStorage.getItem(LANG_KEY) || "fr";
let SESSION_PASSWORD = null;
let SESSION_NAME = null;
try { SESSION_PASSWORD = localStorage.getItem(SESSION_KEY) || null; } catch(e) { SESSION_PASSWORD = null; }
try { SESSION_NAME = localStorage.getItem(SESSION_NAME_KEY) || null; } catch(e) { SESSION_NAME = null; }
let ORDERS = [];
let PENDING_ITEMS = [];
let PARTNERS = [];
let DRIVERS = [];
let DASHBOARD_ORDERS = [];
let COMPTA_PARTNERS = [];
let ADS = [];
let CURRENT_TAB = "orders";

/* ============================================================
   I18N
   ============================================================ */
const I18N = {
  fr: {
    tagline: "Espace admin",
    toggleLabel: "AR",
    loginTitle: "Connexion admin",
    loginSubtitle: "Entre le mot de passe administrateur.",
    lblPassword: "Mot de passe",
    loginBtn: "Se connecter",
    logoutBtn: "Déconnexion",
    whoText: "Administrateur",
    refreshLabel: "↻ Actualiser",
    footerNote: "MT Delivery · Meftah, Blida",
    passwordRequired: "Merci d'entrer le mot de passe.",
    loginFailedGeneric: "Erreur de connexion. Vérifie ta connexion internet et réessaie.",
    loadFailedGeneric: "Impossible de charger les commandes. Vérifie ta connexion et réessaie.",
    noOrders: "Aucune commande à cette date.",
    statutAconfirmer: "À confirmer",
    statutEnattente: "En attente",
    statutEnlivraison: "En livraison",
    statutLivree: "Livrée",

// Secours JSONP : évite le blocage « Load failed » de Safari sur les appels entre domaines.
function jsonpGet(params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = "mtcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const script = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("Delai depasse")); }, timeoutMs || 20000);
    function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error("JSONP erreur reseau")); };
    script.src = CONFIG.API_URL + "?" + new URLSearchParams(Object.assign({}, params, { callback: cb })).toString();
    document.body.appendChild(script);
  });
}

async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  try {
    const res = await fetch(CONFIG.API_URL + "?" + qs);
    return await res.json();
  } catch (e) {
    return jsonpGet(params);
  }
}

function showError(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideError(box) {
  box.classList.remove("show");
  box.textContent = "";
}
function showSuccess(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideSuccess(box) {
  box.classList.remove("show");
  box.textContent = "";
}

$("loginBtn").addEventListener("click", doLogin);
$("fPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const password = $("fPassword").value.trim();
  hideError($("loginError"));
  if (!password) {
    showError($("loginError"), t("passwordRequired"));
    return;
  }
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "...";
  try {
    const data = await apiGet({ action: "adminLogin", password: password });
    if (data.success) {
      SESSION_PASSWORD = password;
      SESSION_NAME = data.nom || null;
      localStorage.setItem(SESSION_KEY, password);
      if (SESSION_NAME) { localStorage.setItem(SESSION_NAME_KEY, SESSION_NAME); } else { localStorage.removeItem(SESSION_NAME_KEY); }
      enterApp();
    } else {
      showError($("loginError"), data.error || t("loginFailedGeneric"));
    }
  } catch (e) {
    showError($("loginError"), t("loginFailedGeneric"));
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = t("loginBtn");
  }
}

$("logoutBtn").addEventListener("click", () => {
  SESSION_PASSWORD = null;
  SESSION_NAME = null;
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_NAME_KEY);
  $("appScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("fPassword").value = "";
});

function todayStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function firstDayOfMonthStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-01";
}

function enterApp() {
  $("loginScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("whoText").textContent = SESSION_NAME ? (t("whoText") + " : " + SESSION_NAME) : t("whoText");
  $("ordersDate").value = todayStr();
  $("dashboardDate").value = todayStr();
  $("comptaDateStart").value = firstDayOfMonthStr();
  $("comptaDateEnd").value = todayStr();
  loadOrders();
  loadPendingItems();
}

async function loadOrders() {
  hideError($("errorBox"));
  try {
    const date = $("ordersDate").value || todayStr();
    const data = await apiGet({ action: "getAllOrders", password: SESSION_PASSWORD, date: date });
    if (data.success) {
      ORDERS = data.orders;
      renderOrders();
    } else {
      showError($("errorBox"), data.error || t("loadFailedGeneric"));
      if (data.error && /mot de passe|password/i.test(data.error)) {
        $("logoutBtn").click();
      }
    }
  } catch (e) {
    showError($("errorBox"), t("loadFailedGeneric"));
  }
}

function renderOrders() {
  $("listOrders").innerHTML = ORDERS.length
    ? ORDERS.map(orderCardHtml).join("")
    : emptyStateHtml(t("noOrders"), "📦");

  document.querySelectorAll("[data-action-order]").forEach(btn => {
    btn.addEventListener("click", () => onUpdateStatus(btn.dataset.actionOrder, btn.dataset.newStatus, btn));
  });
}

function badgeInfo(statut) {
  const s = String(statut || "").trim();
  if (s === "À confirmer") return { cls: "aconfirmer", label: t("statutAconfirmer") };
  if (s === "En attente") return { cls: "enattente", label: t("statutEnattente") };
  if (s === "En livraison") return { cls: "enlivraison", label: t("statutEnlivraison") };
  if (s === "Livrée") return { cls: "livree", label: t("statutLivree") };
  if (s === "Annulée") return { cls: "annulee", label: t("statutAnnulee") };
  return { cls: "enattente", label: s };
}

function phoneToWaNumber(phone) {
  let digits = String(phone == null ? "" : phone).replace(/\D/g, "");
  digits = digits.replace(/^0+/, "");
  if (!digits) return "";
  if (digits.indexOf("213") === 0) return digits;
  return "213" + digits;
}

function actionsHtml(o) {
  const s = String(o.statut || "").trim();
  const numero = escapeAttr(o.numero);
  let buttons = "";
  if (s === "À confirmer") {
    buttons += `<button class="btn-action btn-confirm" type="button" data-action-order="${numero}" data-new-status="En attente">${escapeHtml(t("btnConfirm"))}</button>`;
    buttons += `<button class="btn-action btn-cancel" type="button" data-action-order="${numero}" data-new-status="Annulée">${escapeHtml(t("btnCancel"))}</button>`;
  } else if (s === "En attente" || s === "En livraison") {
    buttons += `<button class="btn-action btn-deliver" type="button" data-action-order="${numero}" data-new-status="Livrée">${escapeHtml(t("btnDeliver"))}</button>`;
    buttons += `<button class="btn-action btn-cancel" type="button" data-action-order="${numero}" data-new-status="Annulée">${escapeHtml(t("btnCancel"))}</button>`;
  }
  const waNumber = phoneToWaNumber(o.telephone);
  if (waNumber) {
    const msg = encodeURIComponent(t("waMsgIntro") + " N° " + (o.numero || ""));
    buttons += `<a class="btn-action btn-whatsapp" href="https://wa.me/${waNumber}?text=${msg}" target="_blank" rel="noopener">${escapeHtml(t("btnWhatsapp"))}</a>`;
  }
  return buttons ? `<div class="actions-row">${buttons}</div>` : "";
}

function orderCardHtml(o) {
  const b = badgeInfo(o.statut);
  return `
    <div class="order-card">
      <div class="row1">
        <div class="numero">${escapeHtml(o.numero || "")}</div>
        <div class="total">${escapeHtml(String(o.total || 0))} DA</div>
      </div>
      <div class="client">${escapeHtml(o.client || "")} · ${escapeHtml(String(o.telephone || ""))}</div>
      <div class="meta">${escapeHtml(o.adresse || "")} (${escapeHtml(o.zone || "")}) · ${escapeHtml(o.horodatage || "")}</div>
      <div class="articles">${escapeHtml(o.articles || "")}</div>
      <span class="badge ${b.cls}">${escapeHtml(b.label)}</span>
      ${actionsHtml(o)}
    </div>
  `;
}

async function onUpdateStatus(orderNumber, newStatus, btnEl) {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  const allBtns = document.querySelectorAll("[data-action-order]");
  allBtns.forEach(b => b.disabled = true);
  try {
    const data = await apiGet({
      action: "updateOrderStatus",
      password: SESSION_PASSWORD,
      orderNumber: orderNumber,
      newStatus: newStatus
    });
    if (data.success) {
      const o = ORDERS.find(x => String(x.numero) === String(orderNumber));
      if (o) o.statut = newStatus;
      renderOrders();
    } else {
      showError($("errorBox"), data.error || t("updateFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("updateFailedGeneric"));
  } finally {
    document.querySelectorAll("[data-action-order]").forEach(b => b.disabled = false);
  }
}

async function onModerate(itemId, decision, btnEl) {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  document.querySelectorAll("[data-mod-id]").forEach(b => b.disabled = true);
  try {
    const data = await apiGet({
      action: "moderateMenuItem",
      password: SESSION_PASSWORD,
      itemId: itemId,
      decision: decision
    });
    if (data.success) {
      PENDING_ITEMS = PENDING_ITEMS.filter(x => String(x.id) !== String(itemId));
      updateModBadge();
      renderModeration();
    } else {
      showError($("errorBox"), data.error || t("moderateFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("moderateFailedGeneric"));
  } finally {
    document.querySelectorAll("[data-mod-id]").forEach(b => b.disabled = false);
  }
}

async function loadDrivers() {

function statusBadgeInfo(statut) {
  const s = String(statut || "").trim().toLowerCase();
  if (s === "actif") return { cls: "actif", label: t("statusActif") };
  if (s === "refuse" || s === "refusé") return { cls: "refuse", label: t("statusRefuse") };
  return { cls: "enattente", label: t("statusEnAttente") };
}

function entityCardHtml(kind, item, extraMeta) {
  const b = statusBadgeInfo(item.statut);
  const tel = escapeAttr(item.telephone);
  const isActive = String(item.statut || "").trim().toLowerCase() === "actif";
  const toggleLabel = isActive ? t("btnDeactivate") : t("btnActivate");
  const toggleClass = isActive ? "btn-deactivate" : "btn-activate";
  const newStatus = isActive ? "En attente" : "Actif";
  return `
    <div class="partner-card">
      <div class="nom">${escapeHtml(item.nom || "")}</div>
      <div class="meta">${extraMeta}</div>
      <span class="status-badge ${b.cls}">${escapeHtml(b.label)}</span>
      <div class="actions-row">
        <button class="btn-action ${toggleClass}" type="button" data-toggle-kind="${kind}" data-toggle-tel="${tel}" data-new-status="${escapeAttr(newStatus)}">${escapeHtml(toggleLabel)}</button>
      </div>
      <div class="pin-row">
        <input type="text" inputmode="numeric" maxlength="4" placeholder="${item.pin ? "••••" : "----"}">
        <button class="btn-action btn-savepin" type="button" data-savepin-kind="${kind}" data-savepin-tel="${tel}">${escapeHtml(t("btnSavePin"))}</button>
      </div>
    </div>
  `;
}

function partnerCardHtml(p) {
  const meta = `${escapeHtml(p.type || "")} · ${escapeHtml(p.zone || "")} · ${escapeHtml(p.telephone || "")}`;
  return entityCardHtml("partner", p, meta);
}
function driverCardHtml(d) {
  const meta = `${escapeHtml(d.zone || "")} · ${escapeHtml(d.vehicule || "")} · ${escapeHtml(d.telephone || "")}`;
  return entityCardHtml("driver", d, meta);
}

function wireEntityButtons(containerId) {
  document.querySelectorAll("#" + containerId + " [data-toggle-kind]").forEach(btn => {
    btn.addEventListener("click", () => onToggleStatus(btn.dataset.toggleKind, btn.dataset.toggleTel, btn.dataset.newStatus, btn));
  });
  document.querySelectorAll("#" + containerId + " [data-savepin-kind]").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = btn.closest(".pin-row").querySelector("input");
      onSavePin(btn.dataset.savepinKind, btn.dataset.savepinTel, input, btn);
    });
  });
}

function renderPartners() {
  $("listPartners").innerHTML = PARTNERS.length
    ? PARTNERS.map(partnerCardHtml).join("")
    : emptyStateHtml(t("noPartners"), "🏪");
  wireEntityButtons("listPartners");
}

function renderDrivers() {
  $("listDrivers").innerHTML = DRIVERS.length
    ? DRIVERS.map(driverCardHtml).join("")
    : emptyStateHtml(t("noDrivers"), "🛵");
  wireEntityButtons("listDrivers");
}

async function onToggleStatus(kind, telephone, newStatus, btnEl) {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  btnEl.disabled = true;
  try {
    const action = kind === "partner" ? "updatePartnerStatus" : "updateDriverStatus";
    const data = await apiGet({ action: action, password: SESSION_PASSWORD, telephone: telephone, newStatus: newStatus });
    if (data.success) {
      const list = kind === "partner" ? PARTNERS : DRIVERS;
      const item = list.find(x => String(x.telephone) === String(telephone));
      if (item) item.statut = newStatus;
      if (kind === "partner") renderPartners(); else renderDrivers();
      showSuccess($("successBox"), t("statusUpdated"));
    } else {
      showError($("errorBox"), data.error || t("updateStatusFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("updateStatusFailedGeneric"));
  } finally {
    btnEl.disabled = false;
  }
}

async function onSavePin(kind, telephone, inputEl, btnEl) {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  const pin = inputEl ? inputEl.value.trim() : "";
  if (!/^[0-9]{4}$/.test(pin)) {
    showError($("errorBox"), t("pinInvalid"));
    return;
  }
  btnEl.disabled = true;
  try {
    const action = kind === "partner" ? "setPartnerPin" : "setDriverPin";
    const data = await apiGet({ action: action, password: SESSION_PASSWORD, telephone: telephone, pin: pin });
    if (data.success) {
      const list = kind === "partner" ? PARTNERS : DRIVERS;
      const item = list.find(x => String(x.telephone) === String(telephone));
      if (item) item.pin = pin;
      if (kind === "partner") renderPartners(); else renderDrivers();
      showSuccess($("successBox"), t("pinSaved"));
    } else {
      showError($("errorBox"), data.error || t("savePinFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("savePinFailedGeneric"));
  } finally {
    btnEl.disabled = false;
  }
}

/* ============================================================
   TABLEAU DE BORD
   ============================================================ */
async function loadDashboard() {
  hideError($("errorBox"));
  try {
    const date = $("dashboardDate").value || todayStr();
    const data = await apiGet({ action: "getAllOrders", password: SESSION_PASSWORD, date: date });
    if (data.success) {
      DASHBOARD_ORDERS = data.orders || [];
      renderDashboard();
    } else if (CURRENT_TAB === "dashboard") {
      showError($("errorBox"), data.error || t("loadDashboardFailedGeneric"));
    }
  } catch (e) {
    if (CURRENT_TAB === "dashboard") showError($("errorBox"), t("loadDashboardFailedGeneric"));
  }
}

function parseArticlesText(articlesText) {
  const result = [];
  String(articlesText || "").split("|").forEach(part => {
    const m = part.trim().match(/^(\d+)\s*x\s+(.+?)\s*\(/i);
    if (m) {
      result.push({ qty: parseInt(m[1], 10) || 0, nom: m[2].trim() });
    }
  });
  return result;
}

function renderDashboard() {
  const valid = DASHBOARD_ORDERS.filter(o => String(o.statut || "").trim() !== "Annulée");
  const nbCommandes = valid.length;
  const totalDA = valid.reduce((sum, o) => sum + (Number(o.total) || 0), 0);

  const dishCounts = {};
  valid.forEach(o => {
    parseArticlesText(o.articles).forEach(item => {
      dishCounts[item.nom] = (dishCounts[item.nom] || 0) + item.qty;
    });
  });
  let bestDish = null, bestQty = 0;
  Object.keys(dishCounts).forEach(nom => {
    if (dishCounts[nom] > bestQty) { bestQty = dishCounts[nom]; bestDish = nom; }
  });

  const bestLabel = bestDish
    ? escapeHtml(t("statBestDish")) + " (" + bestQty + ")"
    : escapeHtml(t("statBestDish"));

  $("dashboardStats").innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="value">${nbCommandes}</div>
        <div class="label">${escapeHtml(t("statNbOrders"))}</div>
      </div>
      <div class="stat-card">
        <div class="value">${totalDA.toLocaleString("fr-FR")} DA</div>
        <div class="label">${escapeHtml(t("statTotalDA"))}</div>
      </div>
      <div class="stat-card best">
        <div class="value">${bestDish ? escapeHtml(bestDish) : escapeHtml(t("noBestDish"))}</div>
        <div class="label">${bestLabel}</div>
      </div>
    </div>
  `;
}

async function loadAdsAdmin() {
  hideError($("errorBox"));
  try {
    const data = await apiGet({ action: "getAllAds", password: SESSION_PASSWORD });
    if (data.success) {
      ADS = data.ads || [];
      renderAdsAdmin();
    } else if (CURRENT_TAB === "pub") {
      showError($("errorBox"), data.error || t("loadAdsFailedGeneric"));
    }
  } catch (e) {
    if (CURRENT_TAB === "pub") showError($("errorBox"), t("loadAdsFailedGeneric"));
  }
}

function adCardHtml(ad) {
  const id = escapeAttr(ad.id);
  const thumb = ad.imageUrl ? `<img class="thumb" src="${escapeAttr(ad.imageUrl)}" alt="">` : "";
  const statusLabel = ad.actif ? t("statusActif") : t("statusEnAttente");
  const statusCls = ad.actif ? "actif" : "enattente";
  return `
    <div class="ad-card">
      ${thumb}
      <div class="info">
        <div class="nom">${escapeHtml(ad.nomRestaurant || "")}</div>
        ${ad.texte ? `<div class="texte">${escapeHtml(ad.texte)}</div>` : ""}
        <span class="status-badge ${statusCls}">${escapeHtml(statusLabel)}</span>
        <div class="ordre">${escapeHtml(t("lblAdOrdre"))} : ${escapeHtml(String(ad.ordre || 0))}</div>
        <div class="actions-row">
          <button class="btn-action btn-edit" type="button" data-edit-ad="${id}">${escapeHtml(t("btnAdEdit"))}</button>
          <button class="btn-action btn-delete" type="button" data-delete-ad="${id}">${escapeHtml(t("btnAdDelete"))}</button>
        </div>
      </div>
    </div>
  `;
}

function renderAdsAdmin() {
  $("listAds").innerHTML = ADS.length
    ? ADS.map(adCardHtml).join("")
    : emptyStateHtml(t("noAds"), "📣");
  document.querySelectorAll("#listAds [data-edit-ad]").forEach(btn => {
    btn.addEventListener("click", () => onEditAd(btn.dataset.editAd));
  });
  document.querySelectorAll("#listAds [data-delete-ad]").forEach(btn => {
    btn.addEventListener("click", () => onDeleteAd(btn.dataset.deleteAd, btn));
  });
}

function onEditAd(id) {
  const ad = ADS.find(x => String(x.id) === String(id));
  if (!ad) return;
  $("adFormId").value = ad.id;
  $("adFormNom").value = ad.nomRestaurant || "";
  $("adFormImage").value = ad.imageUrl || "";
  $("adFormLien").value = ad.lienUrl || "";
  $("adFormTexte").value = ad.texte || "";
  $("adFormOrdre").value = ad.ordre || 0;
  $("adFormActif").checked = !!ad.actif;
  $("adFormTitle").textContent = t("adFormTitleEdit");
  $("adFormCancelBtn").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetAdForm() {
  $("adFormId").value = "";
  $("adFormNom").value = "";
  $("adFormImage").value = "";
  $("adFormLien").value = "";
  $("adFormTexte").value = "";
  $("adFormOrdre").value = 0;
  $("adFormActif").checked = true;
  $("adFormTitle").textContent = t("adFormTitleNew");
  $("adFormCancelBtn").classList.add("hidden");
}

$("adFormCancelBtn").addEventListener("click", resetAdForm);

$("adFormSaveBtn").addEventListener("click", async () => {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  const nomRestaurant = $("adFormNom").value.trim();
  const imageUrl = $("adFormImage").value.trim();
  if (!nomRestaurant || !imageUrl) {
    showError($("errorBox"), t("adSaveRequired"));
    return;
  }
  const btn = $("adFormSaveBtn");
  btn.disabled = true;
  try {
    const data = await apiGet({
      action: "saveAd",
      password: SESSION_PASSWORD,
      id: $("adFormId").value || "",
      nomRestaurant: nomRestaurant,
      imageUrl: imageUrl,
      lienUrl: $("adFormLien").value.trim(),
      texte: $("adFormTexte").value.trim(),
      actif: $("adFormActif").checked ? "OUI" : "NON",
      ordre: $("adFormOrdre").value || 0
    });
    if (data.success) {
      showSuccess($("successBox"), t("adSaved"));
      resetAdForm();
      loadAdsAdmin();
    } else {
      showError($("errorBox"), data.error || t("saveAdFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("saveAdFailedGeneric"));
  } finally {
    btn.disabled = false;
  }
});

async function onDeleteAd(id, btnEl) {
  hideError($("errorBox"));
  hideSuccess($("successBox"));
  if (!window.confirm(t("adDeleteConfirm"))) return;
  btnEl.disabled = true;
  try {
    const data = await apiGet({ action: "deleteAd", password: SESSION_PASSWORD, id: id });
    if (data.success) {
      ADS = ADS.filter(x => String(x.id) !== String(id));
      renderAdsAdmin();
      showSuccess($("successBox"), t("adDeleted"));
    } else {
      showError($("errorBox"), data.error || t("deleteAdFailedGeneric"));
    }
  } catch (e) {
    showError($("errorBox"), t("deleteAdFailedGeneric"));
  } finally {
    btnEl.disabled = false;
  }
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function emptyStateHtml(msg, emoji) {
  return `<div class="empty-state"><span class="emoji">${emoji || "📦"}</span>${escapeHtml(msg)}</div>`;
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ============================================================
   DÉMARRAGE
   ============================================================ */
applyLanguage();
if (SESSION_PASSWORD) {
  enterApp();
}
