name: Android Client (APK de test)

on:
  push:
    branches: [android]
    paths:
      - "android-apps/client/**"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Projet Android
        run: npx cap add android
      - name: Autorisations et configuration Firebase
        run: node scripts/patch-android.js && grep -c 'uses-permission' android/app/src/main/AndroidManifest.xml
      - name: Icône et écran de démarrage
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - name: Synchronisation
        run: npx cap sync android
      - name: Compilation (debug)
        working-directory: android-apps/client/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mt-food-debug-apk
          path: android-apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
