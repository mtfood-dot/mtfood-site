<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>MT Delivery — Politique de confidentialité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --blue-900:#0a2647; --blue-700:#134a8f; --gold-500:#d4a017; --bg:#f3f5f9; --card:#fff; --text:#131b28; --muted:#69748a; --border:#e6eaf1; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:40px;}
  html[dir="rtl"] body{font-family:'Tajawal','Plus Jakarta Sans',sans-serif;}
  header.top{background:#fff;padding:20px 0 22px;border-bottom:1px solid var(--border);text-align:center;position:relative;}
  header.top a{display:inline-block;color:var(--blue-700);font-weight:800;font-size:13px;text-decoration:none;}
  .lang-toggle{position:absolute;top:14px;right:14px;background:#fff;border:1.5px solid var(--gold-500);color:var(--blue-900);
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;}
  html[dir="rtl"] .lang-toggle{right:auto;left:14px;}
  main{max-width:680px;margin:0 auto;padding:24px 18px 40px;}
  .card{background:var(--card);border-radius:20px;border:1px solid var(--border);padding:26px;box-shadow:0 1px 2px rgba(16,24,40,.06);}
  h1{font-size:21px;color:var(--blue-900);margin:0 0 6px;}
  .updated{font-size:12px;color:var(--muted);margin-bottom:22px;}
  h2{font-size:15px;color:var(--blue-900);margin:22px 0 8px;}
  p, li{font-size:13.5px;line-height:1.7;color:var(--text);}
  .draft-note{background:#fdf3d9;border:1px solid #f0dca5;border-radius:12px;padding:12px 14px;font-size:12.5px;
    color:#7a5c00;margin-bottom:20px;line-height:1.6;}
</style>
</head>
<body>
<header class="top">
  <a href="index.html" id="back">← Retour à l'accueil</a>
  <button class="lang-toggle" id="langToggle" type="button">AR</button>
</header>
<main>
  <section class="card" id="content"></section>
</main>
<script>
const LANG_KEY = "mtd_lang";
let LANG = localStorage.getItem(LANG_KEY) || "fr";

const TXT = {
  fr: {
    back: "← Retour à l'accueil",
    draftNote: "⚠️ Modèle de départ à valider par MT Delivery avant publication réelle.",
    title: "Politique de confidentialité",
    updated: "Dernière mise à jour : à compléter",
    body: `
      <h2>1. Données collectées</h2>
      <p>Lors de la création d'un compte ou d'une commande : prénom, nom, e-mail et/ou numéro de téléphone, adresse de livraison, mot de passe (stocké sous forme chiffrée, jamais en texte brut).</p>
      <p><b>Position géographique :</b> lorsque tu utilises « Utiliser ma position actuelle », ta position est lue une seule fois, au moment du clic (jamais en continu). Les coordonnées de ton adresse de livraison, la distance au centre de Meftah, la zone et les frais sont enregistrés avec la commande, pour la livraison et le calcul des frais. L'adresse affichée est déterminée grâce au service OpenStreetMap (Nominatim), à qui sont envoyées les coordonnées ou l'adresse que tu saisis.</p>
      <h2>2. Utilisation des données</h2>
      <p>Ces données servent uniquement à traiter les commandes, assurer le suivi de livraison, contacter le client en cas de besoin, et améliorer le service.</p>
      <h2>3. Partage des données</h2>
      <p>Les données nécessaires (nom, téléphone, adresse) sont partagées avec le livreur assigné et le restaurant partenaire concerné, uniquement pour l'exécution de la commande. Aucune donnée n'est vendue à des tiers.</p>
      <h2>4. Conservation</h2>
      <p>Les données sont conservées tant que le compte est actif. L'utilisateur peut demander la suppression de son compte et de ses données via WhatsApp.</p>
      <h2>5. Sécurité</h2>
      <p>Les mots de passe sont stockés sous forme chiffrée (hachée). L'accès aux données est limité aux personnes autorisées de MT Delivery.</p>
      <h2>6. Droits de l'utilisateur</h2>
      <p>L'utilisateur peut à tout moment demander à consulter, corriger ou supprimer ses données personnelles en contactant MT Delivery.</p>
      <h2>7. Contact</h2>
      <p>Pour toute question : WhatsApp 0560 78 84 97.</p>
    `
  },
  ar: {
    back: "← الرجوع للصفحة الرئيسية",
    draftNote: "⚠️ هذا نموذج أولي يجب أن توافق عليه MT Delivery قبل النشر الفعلي.",
    title: "سياسة الخصوصية",
    updated: "آخر تحديث: يُستكمل لاحقًا",
    body: `
      <h2>1. البيانات المجمّعة</h2>
      <p>عند إنشاء حساب أو طلب: الاسم الأول، اسم العائلة، البريد الإلكتروني و/أو رقم الهاتف، عنوان التوصيل، كلمة المرور (تُخزَّن بشكل مشفّر، أبدًا كنص صريح).</p>
      <p><b>الموقع الجغرافي:</b> عند استخدام «استخدم موقعي الحالي» تتم قراءة موقعك مرة واحدة فقط عند الضغط (وليس بشكل مستمر). تُسجَّل إحداثيات عنوان التوصيل والمسافة إلى وسط المفتاح والمنطقة والرسوم مع الطلب لغرض التوصيل وحساب الرسوم. يتم تحديد العنوان المعروض عبر خدمة OpenStreetMap (Nominatim) التي تُرسَل إليها الإحداثيات أو العنوان الذي تكتبه.</p>
      <h2>2. استخدام البيانات</h2>
      <p>تُستخدم هذه البيانات فقط لمعالجة الطلبات، وتأمين تتبع التوصيل، والتواصل مع العميل عند الحاجة، وتحسين الخدمة.</p>
      <h2>3. مشاركة البيانات</h2>
      <p>تتم مشاركة البيانات الضرورية (الاسم، الهاتف، العنوان) مع الموصل المكلّف والمطعم الشريك المعني، فقط لتنفيذ الطلب. لا تُباع أي بيانات لأطراف ثالثة.</p>
      <h2>4. الاحتفاظ بالبيانات</h2>
      <p>تُحفظ البيانات طالما الحساب نشط. يمكن للمستخدم طلب حذف حسابه وبياناته عبر واتساب.</p>
      <h2>5. الأمان</h2>
      <p>تُخزَّن كلمات المرور بشكل مشفّر. الوصول إلى البيانات محدود للأشخاص المخوّلين في MT Delivery.</p>
      <h2>6. حقوق المستخدم</h2>
      <p>يمكن للمستخدم في أي وقت طلب الاطلاع على بياناته الشخصية أو تصحيحها أو حذفها بالتواصل مع MT Delivery.</p>
      <h2>7. التواصل</h2>
      <p>لأي استفسار: واتساب 0560 78 84 97.</p>
    `
  }
};
function $(id){ return document.getElementById(id); }
function render(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("langToggle").textContent = LANG === "ar" ? "FR" : "AR";
  $("back").textContent = TXT[LANG].back;
  $("content").innerHTML =
    '<div class="draft-note">' + TXT[LANG].draftNote + '</div>' +
    '<h1>' + TXT[LANG].title + '</h1>' +
    '<div class="updated">' + TXT[LANG].updated + '</div>' +
    TXT[LANG].body;
}
$("langToggle").addEventListener("click", () => { LANG = LANG === "ar" ? "fr" : "ar"; localStorage.setItem(LANG_KEY, LANG); render(); });
render();
</script>
</body>
</html>
