<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MT Delivery — Espace livreur</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0a2647;
    --blue-800:#0f3562;
    --blue-700:#134a8f;
    --blue-600:#1a5cb0;
    --blue-100:#e9f1fb;
    --gold-600:#b8860f;
    --gold-500:#d4a017;
    --gold-400:#e8bb3d;
    --gold-100:#fdf3d9;
    --bg:#f3f5f9;
    --card:#ffffff;
    --text:#131b28;
    --muted:#69748a;
    --danger:#c0392b;
    --green:#1a7d3a;
    --border:#e6eaf1;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.06);
    --shadow-md:0 6px 20px -6px rgba(16,36,72,.16);
    --shadow-lg:0 20px 40px -12px rgba(10,38,71,.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:40px;-webkit-font-smoothing:antialiased;}
  html[dir="rtl"] body{font-family:'Tajawal','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  a{color:inherit;}
  ::selection{background:var(--gold-100);color:var(--blue-900);}

  header.top{
    background:#ffffff;
    padding:20px 0 22px;position:relative;overflow:hidden;
    border-bottom:1px solid var(--border);text-align:center;
  }
  header.top .brand{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;width:100%;}
  header.top .brand .logo-img{height:auto;width:100%;max-width:280px;display:block;margin:0 auto;}
  header.top .tagline{font-size:13px;color:var(--blue-700);font-weight:700;letter-spacing:.2px;}
  .lang-toggle{
    position:absolute;top:14px;right:14px;z-index:2;
    background:#fff;border:1.5px solid var(--gold-500);color:var(--blue-900);
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;
    font-family:inherit;
  }
  html[dir="rtl"] .lang-toggle{right:auto;left:14px;}

  main{max-width:640px;margin:0 auto;padding:20px 16px 40px;}

  .card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:22px;margin-bottom:16px;}

  /* Écran de connexion */
  .login-card h2{margin:0 0 6px;font-size:19px;color:var(--blue-900);font-weight:800;}
  .login-card p{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.6;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--blue-900);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:15px;font-family:inherit;background:#fbfcfe;transition:border-color .15s ease;
  }
  .field input:focus{outline:none;border-color:var(--blue-600);}
  .btn-primary{
    width:100%;background:linear-gradient(135deg,var(--blue-700),var(--blue-900));color:#fff;border:none;
    border-radius:13px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;
  }
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .error-box{background:#fdeceb;border:1px solid #f3c6c1;color:var(--danger);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:13px;margin-top:12px;line-height:1.5;display:none;}
  .error-box.show{display:block;}

  /* En-tête connecté */
  .session-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(135deg,var(--blue-900),var(--blue-700));color:#fff;border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow-md);}
  .session-bar .who{font-size:14px;font-weight:800;}
  .session-bar .zone{font-size:12px;color:var(--gold-400);font-weight:600;}
  .btn-logout{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);
    border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}

  /* Onglets */
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{flex:1;background:#fff;border:1.5px solid var(--border);border-radius:999px;
    padding:10px 8px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:6px;}
  .tab-btn.active{background:var(--blue-900);color:#fff;border-color:var(--blue-900);}
  .tab-btn .count{background:var(--gold-500);color:var(--blue-900);border-radius:999px;
    min-width:18px;height:18px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
  .tab-btn.active .count{background:var(--gold-400);}

  .refresh-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .btn-refresh{background:#fff;border:1px solid var(--border);border-radius:999px;padding:7px 14px;
    font-size:12.5px;font-weight:700;color:var(--blue-700);cursor:pointer;font-family:inherit;}

  .order-card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    border:1px solid var(--border);padding:16px;margin-bottom:12px;}
  .order-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .order-card .numero{font-size:11.5px;font-weight:800;color:var(--gold-600);letter-spacing:.3px;}
  .order-card .total{font-size:16px;font-weight:800;color:var(--blue-900);}
  .order-card .client{font-size:15px;font-weight:800;margin-bottom:2px;}
  .order-card .meta{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:4px;}
  .order-card .meta b{color:var(--text);font-weight:700;}
  .order-card .articles{font-size:13px;color:var(--text);background:var(--bg);border-radius:var(--radius-sm);
    padding:8px 10px;margin:8px 0;line-height:1.5;}
  .order-card .zone-badge{display:inline-block;background:var(--blue-100);color:var(--blue-700);
    font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:6px;}
  .order-card .actions{display:flex;gap:8px;margin-top:10px;}
  .btn-accept{flex:1;background:linear-gradient(135deg,var(--gold-400),var(--gold-500));color:var(--blue-900);
    border:none;border-radius:11px;padding:11px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .btn-delivered{flex:1;background:linear-gradient(135deg,var(--green),#25a04a);color:#fff;
    border:none;border-radius:11px;padding:11px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .btn-call{background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:11px 16px;
    font-weight:800;font-size:13.5px;color:var(--blue-700);cursor:pointer;text-decoration:none;
    display:flex;align-items:center;justify-content:center;}
  .order-card button:disabled{opacity:.6;}

  .empty-state{text-align:center;color:var(--muted);font-size:13.5px;padding:40px 20px;}
  .empty-state .emoji{font-size:32px;display:block;margin-bottom:10px;}

  .hidden{display:none !important;}

  .footer-note{max-width:960px;margin:24px auto 0;padding:0 16px;text-align:center;
    color:var(--muted);font-size:11.5px;font-weight:500;}
</style>
</head>

<script>
/* ============================================================

   ============================================================ */

  API_URL: "https://script.google.com/macros/s/AKfycbwgXOyXERonv0Yk7X-uhoHuE1Fj26RiYHPR4Tnr7Z_1Ly8wWjsvlE5sp3JJRukRR4ZF/exec"
};

const LANG_KEY = "mtd_espace_livreur_lang";
const SESSION_KEY = "mtd_espace_livreur_session";
let LANG = localStorage.getItem(LANG_KEY) || "fr";
let SESSION = null;
try { SESSION = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch(e) { SESSION = null; }
let CURRENT_TAB = "available";
let AVAILABLE_ORDERS = [];
let MY_ORDERS = [];

/* ============================================================

   ============================================================ */
const I18N = {

function t(key) { return (I18N[LANG] && I18N[LANG][key]) || I18N.fr[key] || key; }
function $(id) { return document.getElementById(id); }

function applyLanguage() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  $("tagline").textContent = t("tagline");
  $("langToggle").textContent = t("toggleLabel");
  $("loginTitle").textContent = t("loginTitle");
  $("loginSubtitle").textContent = t("loginSubtitle");
  $("lblPhone").textContent = t("lblPhone");
  $("fPhone").placeholder = t("phonePlaceholder");
  $("loginBtn").textContent = t("loginBtn");
  $("logoutBtn").textContent = t("logoutBtn");
  $("tabAvailableLabel").textContent = t("tabAvailableLabel");
  $("tabMineLabel").textContent = t("tabMineLabel");
  $("refreshBtn").textContent = t("refreshLabel");
  $("footerNote").textContent = t("footerNote");
  if (SESSION) updateSessionBar();
  renderOrders();
}

$("langToggle").addEventListener("click", () => {
  LANG = LANG === "fr" ? "ar" : "fr";
  localStorage.setItem(LANG_KEY, LANG);
  applyLanguage();
});

/* ============================================================
   APPEL API
   ============================================================ */
async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(CONFIG.API_URL + "?" + qs);
  return res.json();
}

async function apiPost(payload) {
  const res = await fetch(CONFIG.API_URL, {
    method: "POST",
    body: JSON.stringify(payload)
  });
  return res.json();
}

/* ============================================================
   CONNEXION / SESSION
   ============================================================ */
function showError(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideError(box) {
  box.classList.remove("show");
  box.textContent = "";
}

$("loginBtn").addEventListener("click", doLogin);
$("fPhone").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const phone = $("fPhone").value.trim();
  hideError($("loginError"));
  if (!phone) {
    showError($("loginError"), t("phoneRequired"));
    return;
  }
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "...";
  try {
    const data = await apiGet({ action: "livreurLogin", telephone: phone });
    if (data.success) {
      SESSION = { nom: data.nom, telephone: data.telephone, zone: data.zone };
      localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
      enterApp();
    } else {
      showError($("loginError"), data.error || t("loginFailedGeneric"));
    }
  } catch (e) {
    showError($("loginError"), t("loginFailedGeneric"));
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = t("loginBtn");
  }
}

$("logoutBtn").addEventListener("click", () => {
  SESSION = null;
  localStorage.removeItem(SESSION_KEY);
  $("appScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("fPhone").value = "";
});

function updateSessionBar() {
  $("whoText").textContent = SESSION.nom;
  $("zoneText").textContent = t("zoneLabel") + " : " + SESSION.zone;
}

function enterApp() {
  $("loginScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  updateSessionBar();
  loadAll();
}

/* ============================================================
   ONGLETS
   ============================================================ */
$("tabAvailable").addEventListener("click", () => switchTab("available"));
$("tabMine").addEventListener("click", () => switchTab("mine"));

function switchTab(tab) {
  CURRENT_TAB = tab;
  $("tabAvailable").classList.toggle("active", tab === "available");
  $("tabMine").classList.toggle("active", tab === "mine");
  $("listAvailable").classList.toggle("hidden", tab !== "available");
  $("listMine").classList.toggle("hidden", tab !== "mine");
}

$("refreshBtn").addEventListener("click", loadAll);

/* ============================================================
   CHARGEMENT DES COMMANDES
   ============================================================ */
async function loadAll() {
  hideError($("errorBox"));
  try {
    const [avail, mine] = await Promise.all([
      apiGet({ action: "availableOrders", zone: SESSION.zone }),
      apiGet({ action: "myOrders", telephone: SESSION.telephone })
    ]);
    if (avail.success) AVAILABLE_ORDERS = avail.orders;
    if (mine.success) MY_ORDERS = mine.orders;
    if (!avail.success || !mine.success) {
      showError($("errorBox"), t("loadFailedGeneric"));
    }
    renderOrders();
  } catch (e) {
    showError($("errorBox"), t("loadFailedGeneric"));
  }
}

function renderOrders() {
  $("countAvailable").textContent = AVAILABLE_ORDERS.length;
  $("countMine").textContent = MY_ORDERS.length;

  $("listAvailable").innerHTML = AVAILABLE_ORDERS.length
    ? AVAILABLE_ORDERS.map(o => orderCardHtml(o, "available")).join("")
    : emptyStateHtml(t("noAvailable"));

  $("listMine").innerHTML = MY_ORDERS.length
    ? MY_ORDERS.map(o => orderCardHtml(o, "mine")).join("")
    : emptyStateHtml(t("noMine"));

  document.querySelectorAll("[data-accept]").forEach(btn => {
    btn.addEventListener("click", () => onAccept(btn.dataset.accept));
  });
  document.querySelectorAll("[data-deliver]").forEach(btn => {
    btn.addEventListener("click", () => onDeliver(btn.dataset.deliver));
  });
}

function emptyStateHtml(msg) {
  return `<div class="empty-state"><span class="emoji">🛵</span>${escapeHtml(msg)}</div>`;
}

function orderCardHtml(o, kind) {
  const telHref = "tel:" + String(o.telephone).replace(/[^0-9+]/g, "");
  const actionBtn = kind === "available"
    ? `<button class="btn-accept" data-accept="${escapeAttr(o.numero)}">${escapeHtml(t("accept"))}</button>`
    : `<button class="btn-delivered" data-deliver="${escapeAttr(o.numero)}">${escapeHtml(t("markDelivered"))}</button>`;
  return `
    <div class="order-card">
      <div class="zone-badge">${escapeHtml(o.zone || "")}</div>
      <div class="row1">
        <div class="client">${escapeHtml(o.client || "")}</div>
        <div class="total">${escapeHtml(String(o.total || 0))} DA</div>
      </div>
      <div class="meta"><b>${escapeHtml(o.numero || "")}</b> · ${escapeHtml(o.horodatage || "")}</div>
      <div class="meta">📍 ${escapeHtml(o.adresse || "")}</div>
      <div class="articles">${escapeHtml(o.articles || "")}</div>
      <div class="actions">
        ${actionBtn}
        <a class="btn-call" href="${telHref}">${escapeHtml(t("call"))}</a>
      </div>
    </div>
  `;
}

async function onAccept(numero) {
  if (!confirm(t("confirmAccept"))) return;
  const btn = document.querySelector(`[data-accept="${cssEscape(numero)}"]`);
  if (btn) { btn.disabled = true; }
  try {
    const data = await apiPost({
      action: "acceptOrder",
      orderNumber: numero,
      nom: SESSION.nom,
      telephone: SESSION.telephone
    });
    if (data.success) {
      await loadAll();
      switchTab("mine");
    } else {
      showError($("errorBox"), data.error || t("acceptFailedGeneric"));
      await loadAll();
    }
  } catch (e) {
    showError($("errorBox"), t("acceptFailedGeneric"));
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

async function onDeliver(numero) {
  if (!confirm(t("confirmDelivered"))) return;
  const btn = document.querySelector(`[data-deliver="${cssEscape(numero)}"]`);
  if (btn) { btn.disabled = true; }
  try {
    const data = await apiPost({
      action: "markDelivered",
      orderNumber: numero,
      telephone: SESSION.telephone
    });
    if (data.success) {
      await loadAll();
    } else {
      showError($("errorBox"), data.error || t("deliveredFailedGeneric"));
      await loadAll();
    }
  } catch (e) {
    showError($("errorBox"), t("deliveredFailedGeneric"));
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
function cssEscape(s) { return String(s).replace(/"/g, '\\"'); }

/* ============================================================
   DÉMARRAGE
   ============================================================ */
applyLanguage();
if (SESSION && SESSION.telephone) {
  enterApp();
}
</script>
