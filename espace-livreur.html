async function registerPushToken_(role, telephone, orderNumber) {
  try {
    if (!("Notification" in window) || !("serviceWorker" in navigator)) return;
    if (typeof firebase === "undefined") return;
    if (Notification.permission === "denied") return;
    let permission = Notification.permission;
    if (permission === "default") {
      permission = await Notification.requestPermission();
    }
    if (permission !== "granted") return;

    const reg = window.__mtSwReg || await navigator.serviceWorker.ready;
    if (!firebase.apps.length) firebase.initializeApp(FCM_CONFIG);
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) return;
    await apiGet({ action: "saveFcmToken", role: role, token: token, telephone: telephone || "", orderNumber: orderNumber || "" });
  } catch (e) {
    console.warn("Notifications push non activées :", e);
  }
}

/* ============================================================

// Secours JSONP : évite le blocage « Load failed » de Safari sur les appels
// entre domaines (le backend Apps Script supporte le paramètre callback).
function jsonpGet(params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = "mtcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const script = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("Delai depasse")); }, timeoutMs || 20000);
    function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error("JSONP erreur reseau")); };
    script.src = CONFIG.API_URL + "?" + new URLSearchParams(Object.assign({}, params, { callback: cb })).toString();
    document.body.appendChild(script);
  });
}

async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  try {
    const res = await fetch(CONFIG.API_URL + "?" + qs);
    const txt = await res.text();
    try { return JSON.parse(txt); }
    catch (e) { throw new Error("HTTP " + res.status + " reponse non JSON : " + txt.slice(0, 120).replace(/\s+/g, " ")); }
  } catch (e) {
    return jsonpGet(params);
  }
}

async function apiPost(payload) {
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    return await res.json();
  } catch (e) {
    // Secours : mêmes actions en GET/JSONP (nécessite doGet acceptOrder/markDelivered côté Apps Script).
    return jsonpGet(payload);
  }
}

function showError(box, msg) {
  box.textContent = msg;
  box.classList.add("show");
}
function hideError(box) {
  box.classList.remove("show");
  box.textContent = "";
}

$("loginBtn").addEventListener("click", doLogin);
$("fPhone").addEventListener("keydown", (e) => { if (e.key === "Enter") $("fPin").focus(); });
$("fPin").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const phone = $("fPhone").value.trim();
  const pin = $("fPin").value.trim();
  hideError($("loginError"));
  if (!phone) {
    showError($("loginError"), t("phoneRequired"));
    return;
  }
  if (!pin) {
    showError($("loginError"), t("pinRequired"));
    return;
  }
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "...";
  try {
    const data = await apiGet({ action: "livreurLogin", telephone: phone, pin: pin });
    if (data.success) {
      SESSION = { nom: data.nom, telephone: data.telephone, zone: data.zone };
      localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION));
      enterApp();
    } else {
      showError($("loginError"), data.error || t("loginFailedGeneric"));
    }
  } catch (e) {
    showError($("loginError"), t("loginFailedGeneric") + " [" + (e && e.name) + ": " + (e && e.message) + "]");
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = t("loginBtn");
  }
}

$("logoutBtn").addEventListener("click", () => {
  stopLocationSharing();
  SESSION = null;
  localStorage.removeItem(SESSION_KEY);
  $("appScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("fPhone").value = "";
  $("fPin").value = "";
});

function updateSessionBar() {
  $("whoText").textContent = SESSION.nom;
  $("zoneText").textContent = t("zoneLabel") + " : " + SESSION.zone;
}

function enterApp() {
  $("loginScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  updateSessionBar();
  loadAll();
  if (SESSION && SESSION.telephone) {
    registerPushToken_("driver", SESSION.telephone, "");
  }
}

/* ============================================================
   ONGLETS
   ============================================================ */
$("tabAvailable").addEventListener("click", () => switchTab("available"));
$("tabMine").addEventListener("click", () => switchTab("mine"));

function switchTab(tab) {
  CURRENT_TAB = tab;
  $("tabAvailable").classList.toggle("active", tab === "available");
  $("tabMine").classList.toggle("active", tab === "mine");
  $("listAvailable").classList.toggle("hidden", tab !== "available");
  $("listMine").classList.toggle("hidden", tab !== "mine");
}

$("refreshBtn").addEventListener("click", loadAll);

/* ============================================================
   CHARGEMENT DES COMMANDES
   ============================================================ */
async function loadAll() {
  hideError($("errorBox"));
  try {
    const [avail, mine] = await Promise.all([
      apiGet({ action: "availableOrders", zone: SESSION.zone }),
      apiGet({ action: "myOrders", telephone: SESSION.telephone })
    ]);
    if (avail.success) AVAILABLE_ORDERS = avail.orders;
    if (mine.success) MY_ORDERS = mine.orders;
    if (!avail.success || !mine.success) {
      showError($("errorBox"), t("loadFailedGeneric"));
    }
    renderOrders();
    ensureLocationSharing();
  } catch (e) {
    showError($("errorBox"), t("loadFailedGeneric"));
  }
}

/* ============================================================
   SUIVI GPS : partage de position pendant une livraison en cours
   ============================================================ */
let LOCATION_INTERVAL_ID = null;
let LOCATION_PERMISSION_DENIED = false;

function ensureLocationSharing() {
  const hasActive = MY_ORDERS && MY_ORDERS.length > 0;
  if (hasActive && !LOCATION_INTERVAL_ID) {
    // Tentative automatique (fonctionne sur Android/desktop, ou sur iOS si
    // l'autorisation a déjà été accordée précédemment). Sur iOS Safari, la
    // demande d'autorisation n'apparaît de façon fiable que suite à un geste
    // utilisateur direct : on affiche donc aussi le bouton manuel en secours.
    startLocationSharing();
    $("gpsEnableBtn").classList.remove("hidden");
  } else if (!hasActive && LOCATION_INTERVAL_ID) {
    stopLocationSharing();
  }
  if (!hasActive) {
    $("gpsEnableBtn").classList.add("hidden");
  }
}

function startLocationSharing() {
  if (!navigator.geolocation) return;
  sendLocationOnce();
  if (!LOCATION_INTERVAL_ID) {
    LOCATION_INTERVAL_ID = setInterval(sendLocationOnce, 20000);
  }
}

function stopLocationSharing() {
  if (LOCATION_INTERVAL_ID) {
    clearInterval(LOCATION_INTERVAL_ID);
    LOCATION_INTERVAL_ID = null;
  }
  $("gpsBadge").classList.add("hidden");
  $("gpsEnableBtn").classList.add("hidden");
}

function sendLocationOnce() {
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        await apiGet({
          action: "updateLocation",
          telephone: SESSION.telephone,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        });
        // Position envoyée avec succès : le partage est bien actif, on
        // masque le bouton manuel et on affiche le badge.
        $("gpsEnableBtn").classList.add("hidden");
        $("gpsBadge").classList.remove("hidden");
        LOCATION_PERMISSION_DENIED = false;
      } catch (e) { /* silencieux : on retentera au prochain cycle */ }
    },
    () => {
      // Autorisation refusée ou indisponible : on garde le bouton manuel
      // visible (utile sur iOS Safari où l'appel automatique ne déclenche
      // pas toujours la popup d'autorisation) et on affiche un message une
      // seule fois pour ne pas spammer.
      $("gpsBadge").classList.add("hidden");
      $("gpsEnableBtn").classList.remove("hidden");
      if (!LOCATION_PERMISSION_DENIED) {
        LOCATION_PERMISSION_DENIED = true;
        showError($("errorBox"), t("locationDenied"));
      }
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
  );
}

$("gpsEnableBtn").addEventListener("click", () => {
  // Appel synchrone déclenché directement par le tap : c'est ce qui permet
  // à Safari iOS d'afficher la popup d'autorisation de localisation.
  hideError($("errorBox"));
  startLocationSharing();
});

function renderOrders() {
  $("countAvailable").textContent = AVAILABLE_ORDERS.length;
  $("countMine").textContent = MY_ORDERS.length;

  $("listAvailable").innerHTML = AVAILABLE_ORDERS.length
    ? AVAILABLE_ORDERS.map(o => orderCardHtml(o, "available")).join("")
    : emptyStateHtml(t("noAvailable"));

  $("listMine").innerHTML = MY_ORDERS.length
    ? MY_ORDERS.map(o => orderCardHtml(o, "mine")).join("")
    : emptyStateHtml(t("noMine"));

  document.querySelectorAll("[data-accept]").forEach(btn => {
    btn.addEventListener("click", () => onAccept(btn.dataset.accept));
  });
  document.querySelectorAll("[data-deliver]").forEach(btn => {
    btn.addEventListener("click", () => onDeliver(btn.dataset.deliver));
  });
}

function emptyStateHtml(msg) {
  return `<div class="empty-state"><span class="emoji">🛵</span>${escapeHtml(msg)}</div>`;
}

function orderCardHtml(o, kind) {
  const telHref = "tel:" + String(o.telephone).replace(/[^0-9+]/g, "");
  const actionBtn = kind === "available"
    ? `<button class="btn-accept" data-accept="${escapeAttr(o.numero)}">${escapeHtml(t("accept"))}</button>`
    : `<button class="btn-delivered" data-deliver="${escapeAttr(o.numero)}">${escapeHtml(t("markDelivered"))}</button>`;
  return `
    <div class="order-card">
      <div class="zone-badge">${escapeHtml(o.zone || "")}</div>
      <div class="row1">
        <div class="client">${escapeHtml(o.client || "")}</div>
        <div class="total">${escapeHtml(String(o.total || 0))} DA</div>
      </div>
      <div class="meta"><b>${escapeHtml(o.numero || "")}</b> · ${escapeHtml(o.horodatage || "")}</div>
      <div class="meta">📍 ${escapeHtml(o.adresse || "")}</div>
      <div class="articles">${escapeHtml(o.articles || "")}</div>
      <div class="actions">
        ${actionBtn}
        <a class="btn-call" href="${telHref}">${escapeHtml(t("call"))}</a>
      </div>
    </div>
  `;
}

async function onAccept(numero) {
  if (!confirm(t("confirmAccept"))) return;
  const btn = document.querySelector(`[data-accept="${cssEscape(numero)}"]`);
  if (btn) { btn.disabled = true; }
  try {
    const data = await apiPost({
      action: "acceptOrder",
      orderNumber: numero,
      nom: SESSION.nom,
      telephone: SESSION.telephone
    });
    if (data.success) {
      await loadAll();
      switchTab("mine");
    } else {
      showError($("errorBox"), data.error || t("acceptFailedGeneric"));
      await loadAll();
    }
  } catch (e) {
    showError($("errorBox"), t("acceptFailedGeneric"));
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

async function onDeliver(numero) {
  if (!confirm(t("confirmDelivered"))) return;
  const btn = document.querySelector(`[data-deliver="${cssEscape(numero)}"]`);
  if (btn) { btn.disabled = true; }
  try {
    const data = await apiPost({
      action: "markDelivered",
      orderNumber: numero,
      telephone: SESSION.telephone
    });
    if (data.success) {
      await loadAll();
    } else {
      showError($("errorBox"), data.error || t("deliveredFailedGeneric"));
      await loadAll();
    }
  } catch (e) {
    showError($("errorBox"), t("deliveredFailedGeneric"));
  } finally {
    if (btn) { btn.disabled = false; }
  }
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
function cssEscape(s) { return String(s).replace(/"/g, '\\"'); }

/* ============================================================
   DÉMARRAGE
   ============================================================ */
applyLanguage();
if (SESSION && SESSION.telephone) {
  enterApp();
}
</script>

<script src="/install.js" defer></script>
