<style>
:root{
  --blue-900:#0a2647;
  --blue-800:#0f3562;
  --blue-700:#134a8f;
  --blue-600:#1a5cb0;
  --blue-100:#e9f1fb;
  --gold-600:#b8860f;
  --gold-500:#d4a017;
  --gold-400:#e8bb3d;
  --gold-100:#fdf3d9;
  --bg:#f3f5f9;
  --card:#ffffff;
  --text:#131b28;
  --muted:#69748a;
  --danger:#c0392b;
  --green:#1a7d3a;
  --border:#e6eaf1;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 6px 20px -6px rgba(16,36,72,.16);
  --shadow-lg:0 20px 40px -12px rgba(10,38,71,.25);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:40px;-webkit-font-smoothing:antialiased;}
html[dir="rtl"] body{font-family:'Tajawal','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
a{color:inherit;}
::selection{background:var(--gold-100);color:var(--blue-900);}

header.top{
  background:#ffffff;
  padding:20px 0 22px;position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);text-align:center;
}
header.top .brand{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;width:100%;}
header.top .brand .logo-img{height:auto;width:100%;max-width:280px;display:block;margin:0 auto;}
header.top .tagline{font-size:13px;color:var(--blue-700);font-weight:700;letter-spacing:.2px;padding:0 20px;}
.lang-toggle{
  position:absolute;top:14px;inset-inline-end:16px;background:var(--blue-100);color:var(--blue-800);
  border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;
  cursor:pointer;z-index:2;font-family:inherit;
}

main{max-width:520px;margin:0 auto;padding:20px 16px 0;}

.search-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
  padding:22px 20px;margin-bottom:18px;}
.search-card h1{font-size:17px;margin:0 0 4px;color:var(--blue-900);}
.search-card p{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
.search-row{display:flex;gap:8px;}
.search-row input{flex:1;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;
  font-size:14.5px;font-family:inherit;background:var(--bg);color:var(--text);}
.search-row input:focus{outline:none;border-color:var(--blue-600);background:#fff;}
.search-row button{background:linear-gradient(135deg,var(--blue-700),var(--blue-900));color:#fff;border:none;
  border-radius:12px;padding:0 20px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.search-row button:disabled{opacity:.55;}
.error-box{background:#fdecea;border:1px solid #f5c2be;color:var(--danger);font-size:13px;
  padding:11px 13px;border-radius:10px;margin-top:12px;display:none;font-weight:500;}
.error-box.show{display:block;}

.status-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
  padding:18px 20px;margin-bottom:14px;display:none;}
.status-card.show{display:block;}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.status-badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;
  padding:7px 14px;border-radius:999px;}
.status-attente{background:var(--gold-100);color:var(--gold-600);}
.status-livraison{background:var(--blue-100);color:var(--blue-700);}
.status-livree{background:#e5f6ea;color:var(--green);}
.steps{display:flex;margin:16px 0 2px;padding:0;list-style:none;}
.steps li{flex:1;text-align:center;position:relative;font-size:11.5px;font-weight:700;color:var(--muted,#8a94a6);line-height:1.25;padding:0 2px;}
.steps li .b{display:flex;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:#e6eaf1;color:#fff;align-items:center;justify-content:center;font-size:13px;position:relative;z-index:1;}
.steps li::before{content:"";position:absolute;top:12px;inset-inline-start:-50%;width:100%;height:3px;background:#e6eaf1;}
.steps li:first-child::before{display:none;}
.steps li.done{color:var(--blue-900);}
.steps li.done .b,.steps li.done::before{background:var(--green,#1f9d55);}
.steps li.now{color:var(--blue-900);}
.steps li.now .b{background:var(--blue-700,#1a4a9a);box-shadow:0 0 0 4px rgba(26,74,154,.18);}
.steps li.now::before{background:var(--green,#1f9d55);}
.status-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.status-livraison .dot{animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.maj-text{font-size:11.5px;color:var(--muted);}
.livreur-nom{font-size:13px;color:var(--text);margin-top:8px;}
.livreur-nom b{color:var(--blue-900);}

#map{width:100%;height:320px;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
  margin-bottom:16px;display:none;overflow:hidden;}
#map.show{display:block;}

.cancel-box{max-width:520px;margin:14px auto 0;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px;}
.cancel-box.hidden{display:none;}
.cancel-box p{margin:0 0 8px;font-size:13px;line-height:1.6;color:var(--muted);}
.cancel-box input{width:100%;box-sizing:border-box;border:1.5px solid var(--border);border-radius:10px;padding:11px;font-family:inherit;font-size:14px;margin-bottom:8px;}
.cancel-box button{width:100%;background:#fff;border:1.5px solid #e0b4b4;color:#b3261e;border-radius:10px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;}
.cancel-box button:disabled{opacity:.6;}
.cancel-box .cmsg{font-size:13px;font-weight:700;margin-top:8px;min-height:1em;}
.cancel-box .cmsg.err{color:#b3261e;}
.cancel-box a{color:var(--blue-700,#1d4e9e);font-weight:800;}
.rate-box{max-width:520px;margin:14px auto 0;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;}
.rate-box.hidden{display:none;}
.rate-box h3{margin:0 0 4px;font-size:16px;color:var(--blue-900);}
.rate-box p{margin:0 0 10px;font-size:13px;line-height:1.6;color:var(--muted);}
.rate-row{margin:10px 0 4px;font-size:13.5px;font-weight:800;color:var(--text);}
.stars{display:flex;gap:4px;direction:ltr;}
.stars button{background:none;border:0;font-size:34px;line-height:1;color:#c9d3e0;cursor:pointer;padding:2px 3px;font-family:inherit;}
.stars button.on{color:#f0a500;}
.rate-box textarea,.rate-box input{width:100%;box-sizing:border-box;border:1.5px solid var(--border);border-radius:10px;padding:11px;font-family:inherit;font-size:14px;margin-top:10px;}
.rate-box textarea{min-height:70px;resize:vertical;}
.rate-box .go{width:100%;margin-top:10px;background:var(--blue-700,#1d4e9e);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;}
.rate-box .go:disabled{opacity:.6;}
.rate-box .rmsg{font-size:13px;font-weight:700;margin-top:8px;min-height:1em;}
.rate-box .rmsg.err{color:#b3261e;}
.rate-box .rmsg.ok{color:#1c7c3a;}
.wait-note{text-align:center;padding:28px 16px;color:var(--muted);font-size:13px;line-height:1.6;}
.wait-note .emoji{font-size:30px;display:block;margin-bottom:8px;}

footer{text-align:center;font-size:11.5px;color:var(--muted);padding:26px 16px 0;}
.hidden{display:none !important;}
</style>

}

async function registerPushToken_(role, telephone, orderNumber) {
  try {
    if (!("Notification" in window) || !("serviceWorker" in navigator)) return;
    if (typeof firebase === "undefined") return;
    if (Notification.permission === "denied") return;
    let permission = Notification.permission;
    if (permission === "default") {
      permission = await Notification.requestPermission();
    }
    if (permission !== "granted") return;

    const reg = window.__mtSwReg || await navigator.serviceWorker.ready;
    if (!firebase.apps.length) firebase.initializeApp(FCM_CONFIG);
    const messaging = firebase.messaging();
    const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) return;
    await apiGet({ action: "saveFcmToken", role: role, token: token, telephone: telephone || "", orderNumber: orderNumber || "" });
  } catch (e) {
    console.warn("Notifications push non activées :", e);
  }
}

// Secours JSONP : évite le blocage « Load failed » de Safari sur les appels entre domaines.
function jsonpGet(params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cb = "mtcb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const script = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("Delai depasse")); }, timeoutMs || 20000);
    function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error("JSONP erreur reseau")); };
    script.src = CONFIG.API_URL + "?" + new URLSearchParams(Object.assign({}, params, { callback: cb })).toString();
    document.body.appendChild(script);
  });
}

async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  try {
    const res = await fetch(CONFIG.API_URL + "?" + qs);
    return await res.json();
  } catch (e) {
    return jsonpGet(params);
  }
}

let MAP = null;
let MARKER = null;
let POLL_INTERVAL_ID = null;

function statusMeta(statut){
  const s = String(statut || "").trim();
  if (s === "Précommande") return { cls: "status-attente", label: t("statutPre") };
  if (s === "À confirmer") return { cls: "status-attente", label: t("statutAConfirmer") };
  if (s === "Annulée") return { cls: "status-attente", label: t("statutAnnulee") };
  if (s === "En attente") return { cls: "status-attente", label: t("statutEnAttente") };
  if (s === "En livraison") return { cls: "status-livraison", label: t("statutEnLivraison") };
  if (s === "Livrée") return { cls: "status-livree", label: t("statutLivree") };
  return { cls: "status-attente", label: s || t("statutAutre") };
}

function ensureMap(lat, lng){
  if (!MAP) {
    MAP = L.map("map", { attributionControl: false, preferCanvas: true }).setView([lat, lng], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      minZoom: 12,
      attribution: "&copy; OpenStreetMap"
    }).addTo(MAP);
    L.control.attribution({ prefix: false, position: "bottomright" })
      .addAttribution("&copy; OpenStreetMap")
      .addTo(MAP);
    // Marqueur léger (cercle SVG) plutôt que l'icône Leaflet par défaut :
    // évite deux requêtes réseau supplémentaires (icône + ombre) et rend la
    // carte plus rapide à afficher, surtout sur mobile.
    MARKER = L.circleMarker([lat, lng], {
      radius: 10,
      color: "#fff",
      weight: 3,
      fillColor: "#1a5cb0",
      fillOpacity: 1
    }).addTo(MAP);
  } else {
    MARKER.setLatLng([lat, lng]);
    MAP.panTo([lat, lng], { animate: true, duration: 0.5 });
  }
  $("map").classList.add("show");
  // Le conteneur peut avoir été caché (display:none) avant sa première
  // apparition ; Leaflet a besoin de recalculer sa taille une fois visible.
  // Le conteneur passe de display:none à visible juste avant, donc Leaflet
  // doit recalculer sa taille une fois le layout stabilisé. Un seul appel
  // différé n'est pas toujours suffisant (le navigateur peut ne pas avoir
  // fini de réorganiser la page) : on réessaie donc à plusieurs échéances.
  [0, 120, 400].forEach((delay) => {
    setTimeout(() => { if (MAP) MAP.invalidateSize(); }, delay);
  });
}

const CS_PHONE = "0560 78 84 97";
let LAST_STATUT = "";
function updateCancelBox(statut){
  LAST_STATUT = statut;
  const box = $("cancelBox");
  if (!CURRENT_NUMERO || !statut || statut === "Annulée" || statut === "Livrée") { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  if (statut === "À confirmer" || statut === "Précommande") {
    $("cancelHint").textContent = t("cancelHintFree");
    $("cancelForm").style.display = "";
  } else {
    $("cancelHint").innerHTML = escapeHtml(t("cancelHintCall")) + '<a href="tel:' + CS_PHONE.replace(/\s/g, "") + '"><bdi dir="ltr">' + CS_PHONE + '</bdi></a>';
    $("cancelForm").style.display = "none";
    $("cancelMsg").textContent = "";
  }
}
async function cancelOrder(){
  const phone = $("cancelPhone").value.trim();
  const msg = $("cancelMsg");
  msg.className = "cmsg";
  if (phone.replace(/\D/g, "").length < 8) { msg.className = "cmsg err"; msg.textContent = t("cancelNeedPhone"); return; }
  if (!confirm(t("cancelAsk"))) return;
  $("cancelBtn").disabled = true;
  try {
    const res = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "clientCancelOrder", numero: CURRENT_NUMERO, telephone: phone }) });
    const data = JSON.parse(await res.text());
    if (data.success) { msg.textContent = t("cancelDone"); await fetchOnce(); }
    else { msg.className = "cmsg err"; msg.textContent = data.error || t("cancelFail"); if (data.code === "too_late") await fetchOnce(); }
  } catch (e) { msg.className = "cmsg err"; msg.textContent = t("cancelFail"); }
  finally { $("cancelBtn").disabled = false; }
}

/* ---------- Avis après livraison ---------- */
let LAST_DRIVER = "";
const RATE = { resto: 0, driver: 0 };
function ratedKey(){ return "mtd_rated_" + CURRENT_NUMERO; }
function wasRated(){ try { return localStorage.getItem(ratedKey()) === "1"; } catch (e) { return false; } }
function drawStars(id, key){
  const box = $(id);
  box.innerHTML = [1, 2, 3, 4, 5].map(n =>
    '<button type="button" role="radio" aria-checked="' + (RATE[key] === n) + '" aria-label="' + n + ' ' + escapeHtml(t("starLabel")) + '" data-n="' + n + '" class="' + (n <= RATE[key] ? "on" : "") + '">★</button>').join("");
  box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { RATE[key] = Number(b.dataset.n); drawStars(id, key); }));
}
function updateRatingBox(statut, driverName){
  LAST_STATUT = statut || LAST_STATUT; LAST_DRIVER = driverName || "";
  const box = $("rateBox");
  if (!CURRENT_NUMERO || statut !== "Livrée") { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  $("rateTitle").textContent = t("rateTitle");
  if (wasRated()) { $("rateHint").textContent = ""; $("rateForm").style.display = "none"; $("rateMsg").className = "rmsg ok"; $("rateMsg").textContent = t("rateThanks"); return; }
  $("rateHint").textContent = t("rateHint");
  $("rateRestoLbl").textContent = t("rateResto");
  $("rateDriverLbl").textContent = t("rateDriver");
  $("rateDriverWrap").style.display = driverName ? "" : "none";
  $("rateComment").placeholder = t("rateCommentPh");
  $("ratePhone").placeholder = t("ratePhonePh");
  $("rateBtn").textContent = t("rateBtn");
  drawStars("starsResto", "resto"); drawStars("starsDriver", "driver");
}
async function sendRating(){
  const msg = $("rateMsg"); msg.className = "rmsg";
  const phone = $("ratePhone").value.trim();
  if (!RATE.resto && !(LAST_DRIVER && RATE.driver)) { msg.className = "rmsg err"; msg.textContent = t("rateNeedNote"); return; }
  if (phone.replace(/\D/g, "").length < 8) { msg.className = "rmsg err"; msg.textContent = t("rateNeedPhone"); return; }
  $("rateBtn").disabled = true;
  try {
    const res = await fetch(CONFIG.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "rateOrder", numero: CURRENT_NUMERO, telephone: phone, noteResto: RATE.resto || "", noteLivreur: LAST_DRIVER ? (RATE.driver || "") : "", commentaire: $("rateComment").value.trim() }) });
    const data = JSON.parse(await res.text());
    if (data.success) { try { localStorage.setItem(ratedKey(), "1"); } catch (e) {} $("rateForm").style.display = "none"; $("rateHint").textContent = ""; msg.className = "rmsg ok"; msg.textContent = t("rateThanks"); }
    else { msg.className = "rmsg err"; msg.textContent = data.error || t("rateFail"); }
  } catch (e) { msg.className = "rmsg err"; msg.textContent = t("rateFail"); }
  finally { $("rateBtn").disabled = false; }
}
$("rateBtn").addEventListener("click", sendRating);

function renderSteps(statut, prete){
  const box = $("steps");
  const idx = { "À confirmer": 0, "En attente": 1, "En livraison": 2, "Livrée": 3 }[statut];
  if (idx === undefined) { box.classList.add("hidden"); return; }
  const labels = [t("stepRecue"), prete ? t("stepPrete") : t("stepPrep"), t("stepRoute"), t("stepLivree")];
  box.innerHTML = labels.map((l, i) =>
    '<li class="' + (i < idx || idx === 3 ? "done" : i === idx ? "now" : "") + '"><span class="b">' + (i < idx || idx === 3 ? "✓" : "") + '</span>' + escapeHtml(l) + '</li>').join("");
  box.classList.remove("hidden");
}

function render(data){
  $("statusCard").classList.add("show");
  const meta = statusMeta(data.statut);
  const badge = $("statusBadge");
  badge.className = "status-badge " + meta.cls;
  $("statusBadgeText").textContent = meta.label;
  $("majText").textContent = data.maj ? (t("majPrefix") + data.maj) : "";

  if (data.livreurNom) {
    $("livreurNomRow").classList.remove("hidden");
    $("livreurNomRow").innerHTML = t("livreurLabel") + " : <b>" + escapeHtml(data.livreurNom) + "</b>";
  } else {
    $("livreurNomRow").classList.add("hidden");
  }

  const statut = String(data.statut || "").trim();
  renderSteps(statut, !!data.prete);
  updateCancelBox(statut);
  updateRatingBox(statut, data.livreurNom || "");

  if (statut === "À confirmer" || statut === "Précommande" || statut === "Annulée") {
    $("map").classList.remove("show");
    $("waitNote").classList.remove("hidden");
    $("waitNoteText").textContent = t(statut === "Annulée" ? "annuleeMsg" : (statut === "Précommande" ? "waitPre" : "waitAConfirmer"));
    if (statut === "Annulée") stopPolling();
    return;
  }

  if (statut === "En attente") {
    $("map").classList.remove("show");
    $("waitNote").classList.remove("hidden");
    $("waitNoteText").textContent = t("waitAttente");
    return;
  }

  if (statut === "Livrée") {
    $("waitNote").classList.remove("hidden");
    $("waitNoteText").textContent = t("livreeMsg");
    if (data.lat != null && data.lng != null) {
      ensureMap(data.lat, data.lng);
    }
    stopPolling();
    return;
  }

  // En livraison
  if (data.lat != null && data.lng != null) {
    $("waitNote").classList.add("hidden");
    ensureMap(data.lat, data.lng);
  } else {
    $("map").classList.remove("show");
    $("waitNote").classList.remove("hidden");
    $("waitNoteText").textContent = t("waitNoPosition");
  }
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

/* Lecture rapide dans Supabase (≈ 0,1 s) ; repli sur Apps Script si la copie manque, est ancienne ou si Supabase ne répond pas */
const SB_URL = "https://ubabekqbkapjulnwftqe.supabase.co";
const SB_KEY = "sb_publishable_pRewYmoAUWLdXoXvs0CguQ_bDHCfVem";   // clé publique : ne peut que lire un suivi par son numéro
const SB_MAX_AGE_MS = 8 * 60 * 1000, SB_KEEP_MS = 14 * 24 * 3600 * 1000;
let LAST_SRC = "";
async function sbTrack(numero){
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctl ? setTimeout(function(){ ctl.abort(); }, 4000) : null;
  try {
    const r = await fetch(SB_URL + "/rest/v1/rpc/track_order", { method: "POST", signal: ctl ? ctl.signal : undefined,
      headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_numero: numero }) });
    if (!r.ok) throw new Error("sb " + r.status);
    const row = await r.json();
    if (!row || !row.value || row.value.success !== true) throw new Error("sb vide");
    const age = Date.now() - Date.parse(row.updated_at);
    const done = row.statut === "Livrée" || row.statut === "Annulée";
    if (age > (done ? SB_KEEP_MS : SB_MAX_AGE_MS)) throw new Error("sb ancien");
    return row.value;
  } finally { if (timer) clearTimeout(timer); }
}
async function fetchOnce(){
  try {
    let data = null;
    try { data = await sbTrack(CURRENT_NUMERO); LAST_SRC = "sb"; } catch (e) { data = null; }
    if (!data) { LAST_SRC = "gas"; data = await apiGet({ action: "getOrderLocation", numero: CURRENT_NUMERO }); }
    if (!data.success) {
      showError(data.error || t("notFound"));
      stopPolling();
      return;
    }
    hideError();
    render(data);
  } catch (e) {
    showError(t("loadError"));
  }
}

function stopPolling(){
  if (POLL_INTERVAL_ID) {
    clearTimeout(POLL_INTERVAL_ID);
    POLL_INTERVAL_ID = null;
  }
}

async function pollLoop(){
  if (POLL_INTERVAL_ID === null) return;
  await fetchOnce();
  if (POLL_INTERVAL_ID !== null) POLL_INTERVAL_ID = setTimeout(pollLoop, LAST_SRC === "sb" ? 5000 : 12000);   // 5 s depuis Supabase, 12 s depuis Apps Script
}
async function startTracking(numero){
  CURRENT_NUMERO = numero;
  stopPolling();
  $("searchBtn").disabled = true;
  await fetchOnce();
  $("searchBtn").disabled = false;
  POLL_INTERVAL_ID = setTimeout(pollLoop, LAST_SRC === "sb" ? 5000 : 12000);
  registerPushToken_("client", "", numero);
}

$("searchBtn").addEventListener("click", function(){
  hideError();
  if (!MTForm.validate($("searchCard"))) return;
  const numero = $("fNumero").value.trim().toUpperCase();

  if (numeroParam) {
    $("fNumero").value = numeroParam;
    startTracking(numeroParam);
  }
});
